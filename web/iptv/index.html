<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1020">
<title>Frigo Rosé IPTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Outfit:wght@500;600;700;800&family=Geist:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0F1020; --s1:#161829; --s2:#1E2135; --s3:#2A2E47; --line:#2C3050;
  --ink:#FFFFFF; --mute:#A3A3B2; --faint:#7C7C8C;
  --accent:#7B5CFF; --accent-t:#A992FF; --accent-rgb:123,92,255; --live:#5BE3A3;
  --ui:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --brand:"Unbounded","Arial Black",system-ui,sans-serif;
  --head:"Outfit","Geist",system-ui,sans-serif;
  --pad:3.2rem;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(10px,min(1.25vw,2.22vh),26px);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
.ic{width:1.15em;height:1.15em;flex:none}

/* focus télécommande */
.f{outline:none;transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease,color .16s ease}
.f.on{box-shadow:0 0 0 .2rem #fff;z-index:2}
.btn{display:inline-flex;align-items:center;gap:.6rem;height:2.6rem;padding:0 1.3rem;border-radius:.7rem;background:var(--s3);font-weight:600;font-size:.95rem;white-space:nowrap}
.btn.pri{background:#fff;color:#000}
.btn.acc{background:var(--accent);color:#fff}
.btn.on{transform:scale(1.06)}
.btn.pri.on{box-shadow:0 0 0 .2rem var(--accent-t)}
.chip{display:inline-flex;align-items:center;gap:.4rem;height:2.1rem;padding:0 1rem;border-radius:2rem;background:var(--s2);color:var(--mute);font-weight:600;font-size:.85rem;white-space:nowrap}
.chip.sel{background:#fff;color:#000}

/* ---------- démarrage / profils ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,#140f2a 0%,var(--bg) 60%)}
.logo{display:flex;align-items:center;gap:.8rem;font:800 1.15rem var(--brand);letter-spacing:-.01em}
.logo .mk{width:2.3rem;height:2.3rem;border-radius:.7rem;background:linear-gradient(135deg,#8F73FF,#3D3BE0);display:grid;place-items:center;box-shadow:0 .4rem 1.4rem rgba(var(--accent-rgb),.35)}
.logo .mk svg{width:1.3rem;height:1.3rem}
.logo .big{font:800 1.55rem var(--brand);letter-spacing:.04em;line-height:1}
.logo small{font:600 .62rem var(--ui);letter-spacing:.18em;color:var(--accent-t);margin-left:.1rem;align-self:flex-start;margin-top:.15rem}
#boot .sp{margin-top:2rem;width:2.2rem;height:2.2rem;border-radius:50%;border:.22rem solid var(--s3);border-top-color:var(--accent);animation:spin 1s linear infinite}
#boot p{color:var(--mute);margin-top:1rem;font-size:.9rem;min-height:1.2em}
@keyframes spin{to{transform:rotate(360deg)}}
#who h1{font:600 2.2rem var(--ui);margin:2.6rem 0 2.2rem;letter-spacing:-.02em}
.profs{display:flex;gap:2rem;flex-wrap:wrap;justify-content:center;max-width:90vw}
.prof{display:flex;flex-direction:column;align-items:center;gap:.8rem;width:9rem;color:var(--mute);font-weight:600;font-size:1rem;border-radius:1.2rem;padding:.6rem}
.prof .av{width:8rem;height:8rem;border-radius:1.3rem;display:grid;place-items:center;font:800 3rem var(--brand);color:#fff;transition:transform .16s}
.prof.on{box-shadow:none;color:#fff}
.prof.on .av{transform:scale(1.07);box-shadow:0 0 0 .25rem #fff}
.prof .add{background:var(--s2);color:var(--mute);font:300 3.5rem var(--ui)}
.who-acts{margin-top:2.6rem;display:flex;gap:1rem}
.who-sync{color:var(--mute);font-size:.9rem;max-width:40rem;text-align:center;line-height:1.5;margin-top:1.2rem}
.av-sm{width:2.1rem;height:2.1rem;border-radius:.55rem;display:grid;place-items:center;font:800 .95rem var(--brand);color:#fff;flex:none}

/* ---------- appli ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:2.2rem;padding:1.3rem var(--pad) 2.4rem;background:linear-gradient(to bottom,rgba(15,16,32,.92) 0%,rgba(15,16,32,.6) 55%,transparent 100%);pointer-events:none}
#top>*{pointer-events:auto}
#tabs{display:flex;gap:.4rem;flex:1;min-width:0}
.tab{display:flex;align-items:center;gap:.5rem;height:2.4rem;padding:0 .9rem;border-radius:.65rem;color:var(--mute);font-weight:600;font-size:1rem;white-space:nowrap}
.tab.sel{color:#fff}
.tab.sel::after{content:"";position:absolute;left:1rem;right:1rem;bottom:.25rem;height:.16rem;border-radius:1rem;background:var(--accent)}
.tab{position:relative}
.tab.on{background:#fff;color:#000;box-shadow:none}
.tab.on::after{display:none}
.tbtn{width:2.4rem;height:2.4rem;border-radius:.65rem;display:grid;place-items:center;color:var(--mute)}
.tbtn.sel{color:#fff}
.tbtn.on{background:#fff;color:#000;box-shadow:none}
.me{display:flex;align-items:center;gap:.6rem;padding:.2rem .4rem .2rem .2rem;border-radius:.75rem}
.me.on{box-shadow:0 0 0 .18rem #fff}
#main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:4rem}
.view::-webkit-scrollbar{display:none}

/* accueil */
.hero{position:relative;height:72vh;min-height:24rem;display:flex;align-items:flex-end;padding:0 var(--pad) 5.5rem;overflow:hidden}
.hero .bd{position:absolute;inset:0;background:#000 center/cover no-repeat;transition:opacity .6s}
.hero .bd::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(15,16,32,.96) 0%,rgba(15,16,32,.7) 38%,rgba(15,16,32,0) 70%),linear-gradient(to top,var(--bg) 0%,rgba(15,16,32,0) 40%)}
.hero .bd.blur{filter:blur(28px) saturate(1.3);transform:scale(1.2)}
.hero .hp{position:absolute;right:var(--pad);bottom:5rem;width:15rem;aspect-ratio:2/3;border-radius:.9rem;background:#111 center/cover;box-shadow:0 1.5rem 3rem rgba(0,0,0,.6)}
.hero .tx{position:relative;max-width:46%}
.kick{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-t);margin-bottom:.9rem}
.kick i{width:.45rem;height:.45rem;border-radius:50%;background:var(--accent);display:block}
.hero h2{font:800 3rem/1.04 var(--ui);letter-spacing:-.035em;margin:0 0 .9rem;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:.9rem;align-items:center;color:var(--mute);font-size:.92rem;font-weight:500;flex-wrap:wrap}
.meta b{color:#46D369;font-weight:700}
.meta .pill{border:1px solid #555;border-radius:.3rem;padding:0 .4rem;font-size:.78rem}
.hero p{color:#D6D6DE;font-size:1rem;line-height:1.5;margin:1rem 0 1.6rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero .acts{display:flex;gap:.8rem}
.dots{position:absolute;left:var(--pad);bottom:3.4rem;display:flex;gap:.4rem}
.dots i{width:1.4rem;height:.2rem;border-radius:1rem;background:rgba(255,255,255,.25)}
.dots i.sel{background:#fff}
.rows{position:relative;margin-top:-2.2rem;z-index:2}
.row{margin-bottom:1.9rem}
.row h3{font:700 1.18rem var(--ui);letter-spacing:-.01em;margin:0 var(--pad) .8rem;display:flex;align-items:baseline;gap:.8rem}
.row h3 small{color:var(--faint);font-weight:500;font-size:.85rem}
.strip{display:flex;gap:.85rem;overflow-x:auto;overflow-y:hidden;padding:.5rem var(--pad) .9rem;scrollbar-width:none;scroll-padding:0 var(--pad)}
.strip::-webkit-scrollbar{display:none}

/* cartes */
.card{position:relative;flex:none;width:9.6rem;border-radius:.7rem;background:var(--s2);overflow:hidden;aspect-ratio:2/3;cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .nm{position:absolute;inset:auto 0 0;padding:2.2rem .7rem .65rem;font-size:.82rem;font-weight:600;line-height:1.2;background:linear-gradient(to top,rgba(0,0,0,.92),transparent);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.noimg{background:linear-gradient(150deg,#1d1838,#141420)}
.card.noimg .nm{inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:none;font-size:.95rem;padding:1rem}
.card .nw{position:absolute;top:.5rem;left:.5rem;background:var(--accent);color:#fff;font-size:.62rem;font-weight:800;letter-spacing:.08em;padding:.18rem .42rem;border-radius:.3rem}
.card .rt{position:absolute;top:.5rem;right:.5rem;background:rgba(0,0,0,.7);font-size:.68rem;font-weight:700;padding:.15rem .4rem;border-radius:.3rem}
.card.on{transform:scale(1.08);box-shadow:0 0 0 .2rem #fff,0 1rem 2rem rgba(0,0,0,.6)}
.card.wide{aspect-ratio:16/9;width:16rem}
.card .bar{position:absolute;left:.7rem;right:.7rem;bottom:.55rem;height:.22rem;border-radius:1rem;background:rgba(255,255,255,.25)}
.card .bar i{display:block;height:100%;border-radius:1rem;background:var(--accent)}
.card.wide .nm{padding-bottom:1.3rem}
.card.ch{aspect-ratio:16/10;width:11.5rem;background:var(--s2);display:flex;align-items:center;justify-content:center}
.card.ch img{width:62%;height:56%;object-fit:contain}
.card.ch .nm{background:linear-gradient(to top,rgba(0,0,0,.85),transparent);padding:1.2rem .6rem .45rem;font-size:.75rem;-webkit-line-clamp:1}

/* accueil façon Netflix (télé : grande image qui suit la sélection) */
.home{position:relative}
.home.tvl{position:absolute;inset:0;overflow:hidden}
.home.tvl .hero{position:absolute;inset:0;height:auto;min-height:0;align-items:flex-start;padding:7.4rem var(--pad) 0}
.home.tvl .hero .bd{left:20%}
.home.tvl .hero .bd::after{background:linear-gradient(to right,var(--bg) 0%,rgba(15,16,32,.6) 28%,rgba(15,16,32,0) 62%),linear-gradient(to top,var(--bg) 42%,rgba(15,16,32,.55) 60%,rgba(15,16,32,0) 82%),linear-gradient(to bottom,rgba(15,16,32,.6) 0%,rgba(15,16,32,0) 22%)}
.hero .bd.logo{background-size:auto 34%;background-position:62% 34%;background-color:var(--bg);filter:none;transform:none}
.home.tvl .hero .tx{max-width:46%}
.home.tvl .hero h2{font-size:2.8rem;-webkit-line-clamp:1;margin-bottom:.7rem}
.home.tvl .hero p{-webkit-line-clamp:2;margin:.8rem 0 1.2rem;max-width:40rem;min-height:3em}
.hero .acts{transition:opacity .25s,transform .25s}
.home.tvl.browsing .hero .acts{opacity:0;transform:translateY(.4rem)}
.home.tvl .hero .hp{top:7.6rem;bottom:auto;right:calc(var(--pad) + 4rem);width:10.5rem}
.home .hero .kick span{white-space:nowrap}
.home.tvl .hrows{position:absolute;left:0;right:0;top:58%;bottom:0;overflow:hidden;scroll-behavior:smooth;z-index:2}
.home:not(.tvl) .hrows{position:relative;margin-top:-1.8rem;z-index:2}
.home.tvl .row{margin-bottom:1.4rem}
.t10{position:relative;flex:none;display:flex;align-items:flex-end;padding-left:4.6rem}
.t10 .num{position:absolute;left:-.4rem;bottom:-1.6rem;font:900 9.5rem/1 var(--ui);letter-spacing:-.08em;color:var(--bg);-webkit-text-stroke:.15rem rgba(255,255,255,.75);pointer-events:none}
.t10 .card{position:relative}
.top10 .strip{gap:1.3rem}
.card:not(.noimg):not(.wide):not(.ch) .nm{display:none}
body.names .card:not(.noimg) .nm{display:-webkit-box}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.phead .sub{margin:0}
.sorts{display:flex;gap:.4rem}
.row.inpane{margin:0 0 1.6rem}
.row.inpane h3{margin-left:.4rem}
.row.inpane .strip{padding-left:.4rem;padding-right:.4rem}
.cat.pin span::before{content:"★ ";color:#FFC93D}
.panel.wide{max-width:62rem}
.stabs,.kinds{display:flex;gap:.5rem;margin:0 0 1.2rem;flex-wrap:wrap}
.hint2{color:var(--faint);font-size:.85rem;margin:0 0 .8rem;line-height:1.5}
.slist{display:flex;flex-direction:column;gap:.35rem}
.sline{display:flex;align-items:center;gap:.5rem}
.sline .mi{flex:1}
.sline .mi .sw{margin:0 .7rem 0 0}
.sline .cn{flex:1;min-width:0;padding:.7rem 1rem;font-weight:600;display:flex;gap:.6rem;align-items:baseline;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sline .cn small{color:var(--faint);font-weight:500}
.sline.off .cn{color:var(--faint);text-decoration:line-through}
.ib{height:2.6rem;min-width:2.6rem;padding:0 .9rem;border-radius:.7rem;background:var(--s2);font-weight:700;color:var(--mute);flex:none}
.ib.on{background:#fff;color:#000;box-shadow:none}
.ib.pin.y{color:#FFC93D}
.ib.pin.y.on{color:#B07800}
/* parcourir */
.browse{position:absolute;inset:0;display:flex;padding-top:5.4rem}
.cats{width:19rem;flex:none;overflow-y:auto;scrollbar-width:none;padding:.6rem 1rem 3rem var(--pad)}
.cats::-webkit-scrollbar{display:none}
.cat{display:flex;align-items:center;gap:.6rem;width:100%;min-height:2.5rem;padding:.4rem .9rem;border-radius:.65rem;color:var(--mute);font-weight:600;font-size:.92rem;text-align:left;line-height:1.2}
.cat span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat small{color:var(--faint);font-weight:500;font-size:.78rem}
.cat.sel{color:#fff;background:var(--s2)}
.cat.sel::before{content:"";width:.22rem;align-self:stretch;border-radius:1rem;background:var(--accent);margin:-.1rem .1rem -.1rem -.5rem}
.cat.on{background:#fff;color:#000;box-shadow:none}
.cat.on small{color:#555}
.pane{flex:1;min-width:0;overflow-y:auto;scrollbar-width:none;padding:.6rem var(--pad) 4rem 1.2rem}
.pane::-webkit-scrollbar{display:none}
.pane h2{font:800 1.9rem var(--ui);letter-spacing:-.03em;margin:0 0 .3rem}
.pane .sub{color:var(--faint);font-size:.88rem;margin-bottom:1.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.8rem,1fr));gap:1.3rem 1rem;padding:.4rem}
.grid .card{width:auto}
.empty{color:var(--mute);padding:3rem 0;font-size:1rem;line-height:1.6}
.empty b{color:#fff;display:block;font-size:1.25rem;margin-bottom:.3rem}

/* TV en direct */
.chans{width:27rem;flex:none;overflow-y:auto;scrollbar-width:none;padding:.6rem .6rem 3rem;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.chans::-webkit-scrollbar{display:none}
.chn{display:flex;align-items:center;gap:.9rem;width:100%;height:3.6rem;padding:0 .8rem;border-radius:.7rem;text-align:left}
.chn .no{width:2.2rem;color:var(--faint);font-size:.8rem;font-weight:600;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.chn .lg{width:3.6rem;height:2.4rem;border-radius:.4rem;background:var(--s2);flex:none;display:grid;place-items:center;overflow:hidden}
.chn .lg img{max-width:88%;max-height:80%;object-fit:contain}
.chn .tt{flex:1;min-width:0}
.chn .tt b{display:block;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chn .tt span{display:block;color:var(--faint);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1rem}
.chn .st{color:var(--accent-t);flex:none}
.chn.cur{background:var(--s2)}
.chn.on{background:#fff;color:#000;box-shadow:none}
.chn.on .no,.chn.on .tt span{color:#555}
.epgp{flex:1;min-width:0;padding:1rem var(--pad) 2rem 2.4rem;overflow-y:auto;scrollbar-width:none}
.epgp .big{width:9rem;height:5.6rem;border-radius:.8rem;background:var(--s2);display:grid;place-items:center;margin-bottom:1.3rem}
.epgp .big img{max-width:80%;max-height:75%;object-fit:contain}
.epgp h2{font:800 1.9rem var(--ui);letter-spacing:-.03em;margin:0 0 .4rem}
.epgp .now{margin-top:1.6rem;padding:1.3rem;border-radius:1rem;background:var(--s1);border:1px solid var(--line)}
.epgp .now .l{font-size:.72rem;letter-spacing:.14em;font-weight:800;color:var(--live);text-transform:uppercase;display:flex;align-items:center;gap:.5rem}
.epgp .now .l i{width:.45rem;height:.45rem;border-radius:50%;background:var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.epgp .now h4{font-size:1.25rem;margin:.6rem 0 .3rem;font-weight:700}
.epgp .now .tm{color:var(--mute);font-size:.85rem}
.epgp .now p{color:#cfcfd8;font-size:.92rem;line-height:1.5;margin:.7rem 0 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.prog{height:.25rem;border-radius:1rem;background:var(--s3);margin-top:.8rem;overflow:hidden}
.prog i{display:block;height:100%;background:var(--live)}
.nexts{margin-top:1rem}
.nexts div{display:flex;gap:1rem;padding:.7rem .2rem;border-bottom:1px solid var(--line);font-size:.92rem}
.nexts div span{color:var(--faint);width:3.4rem;flex:none;font-variant-numeric:tabular-nums}
.hint{color:var(--faint);font-size:.82rem;margin-top:1.4rem;display:flex;gap:.6rem;align-items:center}
.hint kbd{font:600 .72rem var(--ui);border:1px solid var(--line);border-radius:.35rem;padding:.1rem .45rem;color:var(--mute)}

/* TV en direct : mosaïque */
.mhead{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;min-height:3.4rem}
.mhead h2{margin:0}
.mhead .sub{margin:0;display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.mhead .mh{color:var(--faint);font-size:.78rem;margin-left:.6rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.4rem,1fr));gap:1rem .8rem;padding:.4rem}
.mtile{display:flex;flex-direction:column;gap:.35rem;min-width:0;cursor:pointer;border-radius:.7rem}
.mtile.on{box-shadow:none}
.mth{position:relative;aspect-ratio:16/9;border-radius:.65rem;background:var(--s2);overflow:hidden;display:grid;place-items:center;transition:transform .16s,box-shadow .16s}
.mtile.on .mth{transform:scale(1.06);box-shadow:0 0 0 .2rem #fff,0 .8rem 1.6rem rgba(0,0,0,.6)}
.mth .bl{position:absolute;inset:-30%;width:160%;height:160%;object-fit:cover;filter:blur(22px) saturate(1.4);opacity:.35}
.mth .lg{position:relative;max-width:58%;max-height:52%;object-fit:contain;filter:drop-shadow(0 .2rem .5rem rgba(0,0,0,.45))}
.mth .ini{display:none;font:800 1.6rem var(--ui);color:var(--mute)}
.mth.nol .ini{display:block}
.mth .n{position:absolute;top:.4rem;left:.4rem;background:rgba(0,0,0,.65);font-size:.66rem;font-weight:800;padding:.12rem .38rem;border-radius:.3rem;font-variant-numeric:tabular-nums}
.mtile.on .mth .n{background:#fff;color:#000}
.mth .st{position:absolute;top:.35rem;right:.4rem;color:#FFC93D}
.mth .st .ic{width:.95rem;height:.95rem}
.mth .pg{position:absolute;left:0;right:0;bottom:0;height:.2rem;background:rgba(255,255,255,.12)}
.mth .pg i{display:block;height:100%;width:0;background:var(--accent)}
.mtile.cur .mth::after{content:"EN COURS";position:absolute;right:.4rem;bottom:.5rem;background:var(--accent);font-size:.58rem;font-weight:800;letter-spacing:.08em;padding:.12rem .35rem;border-radius:.25rem}
.mtile b{font-size:.86rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .1rem}
.mtile .pr{font-size:.74rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .1rem;margin-top:-.2rem}
/* recherche */
.sbox{display:flex;align-items:center;gap:1rem;height:3.6rem;padding:0 1.3rem;border-radius:1rem;background:var(--s1);border:1px solid var(--line);margin:0 var(--pad) 1.6rem}
.sbox input{flex:1;background:none;border:0;outline:none;font-size:1.25rem;font-weight:500;min-width:0}
.sbox.on{box-shadow:0 0 0 .2rem #fff}
.sbox svg{color:var(--faint);width:1.4rem;height:1.4rem}

/* calques (fiche, éditeur, menu) */
.layer{position:fixed;inset:0;z-index:40;background:rgba(5,5,8,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow-y:auto;scrollbar-width:none}
.layer::-webkit-scrollbar{display:none}
#fiche{background:var(--bg)}
#fiche .bd{position:fixed;inset:0;background:#000 center/cover no-repeat}
#fiche .bd::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,var(--bg) 0%,rgba(15,16,32,.86) 40%,rgba(15,16,32,.35) 100%),linear-gradient(to top,var(--bg) 2%,rgba(15,16,32,0) 55%)}
#fiche .bd.blur{filter:blur(30px) saturate(1.3);transform:scale(1.2)}
.fi-in{position:relative;padding:4.2rem var(--pad) 3rem;display:flex;gap:2.6rem;align-items:flex-start}
.fi-in .po{width:14rem;flex:none;aspect-ratio:2/3;border-radius:1rem;background:var(--s2) center/cover;box-shadow:0 1.4rem 3rem rgba(0,0,0,.6)}
.fi-tx{flex:1;min-width:0;max-width:52rem}
.fi-tx h1{font:800 2.7rem/1.05 var(--ui);letter-spacing:-.035em;margin:.2rem 0 .9rem}
.fi-tx p{color:#D6D6DE;font-size:1rem;line-height:1.55;margin:1.1rem 0 1.4rem}
.fi-tx .crew{color:var(--mute);font-size:.88rem;line-height:1.6;margin-bottom:1.6rem}
.fi-tx .crew b{color:#fff;font-weight:600}
.fi-tx .acts{display:flex;gap:.8rem;flex-wrap:wrap}
.seas{display:flex;gap:.5rem;flex-wrap:wrap;margin:2.2rem 0 1rem}
.eps{display:flex;flex-direction:column;gap:.5rem}
.ep{display:flex;gap:1.1rem;align-items:center;padding:.7rem;border-radius:.9rem;text-align:left;width:100%}
.ep .th{position:relative;width:11rem;flex:none;aspect-ratio:16/9;border-radius:.6rem;background:var(--s2) center/cover;overflow:hidden}
.ep .th .bar{position:absolute;left:0;right:0;bottom:0;height:.22rem;background:rgba(255,255,255,.2)}
.ep .th .bar i{display:block;height:100%;background:var(--accent)}
.ep .th .ck{position:absolute;top:.4rem;right:.4rem;width:1.4rem;height:1.4rem;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center}
.ep .n{font-size:1.4rem;font-weight:800;color:var(--faint);width:2.2rem;text-align:center;flex:none}
.ep .d{flex:1;min-width:0}
.ep .d b{display:block;font-weight:600;font-size:1rem}
.ep .d span{display:block;color:var(--faint);font-size:.8rem;margin:.15rem 0 .35rem}
.ep .d p{margin:0;color:var(--mute);font-size:.85rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep.on{background:rgba(255,255,255,.09);box-shadow:0 0 0 .18rem #fff}
.ep.on .th{transform:scale(1.03)}
.ep .th{transition:transform .16s}

.panel{max-width:46rem;margin:5vh auto;background:var(--s1);border:1px solid var(--line);border-radius:1.3rem;padding:2rem 2.2rem}
.panel h2{font:800 1.6rem var(--ui);letter-spacing:-.025em;margin:0 0 .3rem}
.panel .sub{color:var(--mute);font-size:.9rem;line-height:1.5;margin:0 0 1.4rem}
.fld{margin-bottom:1rem}
.fld label{display:block;color:var(--mute);font-size:.8rem;font-weight:600;margin:0 0 .4rem .1rem}
.inp{width:100%;height:3rem;border-radius:.75rem;background:var(--s2);border:1px solid var(--line);padding:0 1rem;font-size:1rem;outline:none}
.inp.on{box-shadow:0 0 0 .18rem #fff;border-color:transparent}
.inp:focus{border-color:var(--accent)}
.row2{display:flex;gap:.8rem}
.row2>*{flex:1;min-width:0}
.colors{display:flex;gap:.6rem;flex-wrap:wrap}
.col{width:2.6rem;height:2.6rem;border-radius:.7rem}
.col.sel{box-shadow:0 0 0 .18rem var(--bg),0 0 0 .32rem #fff}
.col.on{transform:scale(1.15)}
.srcs{display:flex;flex-direction:column;gap:.5rem;margin:.4rem 0 1rem}
.src{display:flex;align-items:center;gap:.9rem;padding:.8rem 1rem;border-radius:.8rem;background:var(--s2);text-align:left;width:100%}
.src .d{flex:1;min-width:0}
.src .d b{display:block;font-size:.95rem}
.src .d span{display:block;color:var(--faint);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ty{font-size:.65rem;font-weight:800;letter-spacing:.1em;padding:.2rem .45rem;border-radius:.3rem;background:var(--s3);color:var(--mute)}
.src .ok{color:var(--live)}
.src.on{background:#fff;color:#000;box-shadow:none}
.src.on .d span{color:#555}
.acts-r{display:flex;gap:.7rem;justify-content:flex-end;margin-top:1.6rem;flex-wrap:wrap}
.msg{font-size:.88rem;line-height:1.5;border-radius:.7rem;padding:.8rem 1rem;margin-top:1rem}
.msg.err{background:#3a1220;color:#ffb3c7}
.msg.ok{background:#0f2e22;color:#9df0c8}
.msg.wait{background:var(--s2);color:var(--mute)}
.mlist{display:flex;flex-direction:column;gap:.4rem}
.mi{display:flex;align-items:center;gap:1rem;padding:.85rem 1rem;border-radius:.8rem;text-align:left;width:100%;font-weight:600}
.mi .ic{color:var(--mute)}
.mi small{margin-left:auto;color:var(--faint);font-weight:500}
.mi.on{background:#fff;color:#000;box-shadow:none}
.mi.on .ic,.mi.on small{color:#444}
.sw{width:2.6rem;height:1.5rem;border-radius:1rem;background:var(--s3);position:relative;margin-left:auto;flex:none}
.sw::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.1rem;height:1.1rem;border-radius:50%;background:#888;transition:transform .15s}
.sw.y{background:var(--accent)}
.sw.y::after{transform:translateX(1.1rem);background:#fff}
.acc-info{display:flex;gap:1.6rem;flex-wrap:wrap;color:var(--mute);font-size:.85rem;margin:.2rem 0 1rem}
.acc-info b{color:#fff}

/* fiche film / série */
.fbd{position:fixed;inset:0;background:#000 center/cover no-repeat}
.fbd::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,var(--bg) 0%,rgba(15,16,32,.9) 30%,rgba(15,16,32,.3) 68%,rgba(15,16,32,.1) 100%),linear-gradient(to top,var(--bg) 0%,rgba(15,16,32,.45) 34%,rgba(15,16,32,0) 60%)}
.fbd.blur{filter:blur(34px) saturate(1.4);transform:scale(1.2);opacity:.75}
.fbd.actor{filter:blur(40px) saturate(1.2);transform:scale(1.3);opacity:.5;background-position:center 20%}
.ftop{position:relative;min-height:84vh;display:flex;align-items:flex-end;gap:3rem;padding:6rem var(--pad) 2.6rem}
.ftx{flex:1;min-width:0;max-width:50rem}
.ftx h1{font:800 3.6rem/1.02 var(--ui);letter-spacing:-.04em;margin:.3rem 0 1rem;text-wrap:balance}
.fmeta{display:flex;gap:1rem;align-items:center;color:#c9c9d3;font-weight:600;font-size:1rem;flex-wrap:wrap}
.fmeta b{color:#46D369}
.fmeta .pill{border:1px solid rgba(255,255,255,.4);border-radius:.3rem;padding:0 .45rem;font-size:.8rem}
.fgen{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.fgen:empty{display:none}
.fgen span{background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:.32rem .85rem;border-radius:2rem;font-size:.82rem;font-weight:600;color:#ececf2}
.fplot{color:#DADAE2;font-size:1.06rem;line-height:1.6;margin:1.2rem 0 1.7rem;max-width:44rem;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ftx .acts{display:flex;gap:.8rem;flex-wrap:wrap}
.btn.glass{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn.glass.on{background:#fff;color:#000}
.btn .bpg{width:3.2rem;height:.24rem;background:rgba(0,0,0,.18);border-radius:1rem;overflow:hidden;margin-left:.3rem}
.btn .bpg i{display:block;height:100%;background:var(--accent)}
.fcrew{color:var(--mute);font-size:.92rem;margin-top:1.4rem}
.fcrew b{color:#fff;font-weight:600}
.fpo{width:15rem;flex:none;aspect-ratio:2/3;border-radius:1rem;background:var(--s2) center/cover;box-shadow:0 2rem 4rem rgba(0,0,0,.7);transform:rotate(2deg);margin-bottom:1rem}
.fmore{position:relative;padding:0 0 3rem}
#fi-eps{padding:0 var(--pad);margin-bottom:2.2rem}
#fi-eps:empty{display:none}
.eph{display:flex;align-items:center;gap:1.4rem;margin-bottom:1rem;flex-wrap:wrap}
.eph h3{margin:0;font:700 1.3rem var(--ui)}
.eph .seas{margin:0}
.ep .th{width:14rem}
.ep .th .pl{position:absolute;inset:0;display:grid;place-items:center;opacity:0;background:rgba(0,0,0,.35);transition:opacity .16s}
.ep .th .pl .ic{width:2rem;height:2rem;color:#fff}
.ep.on .th .pl{opacity:1}
.ep .d b em{font-style:normal;color:var(--faint);margin-right:.15rem}

.cast .strip{gap:1.5rem;padding-top:.8rem}
.pp{flex:none;width:7.6rem;display:flex;flex-direction:column;align-items:center;gap:.65rem;text-align:center;cursor:pointer;border-radius:1rem}
.pp.on{box-shadow:none}
.ph{width:6.6rem;height:6.6rem;border-radius:50%;background:var(--s3) center 20%/cover no-repeat;display:grid;place-items:center;transition:transform .16s,box-shadow .16s;flex:none}
.ph i{font-style:normal;font-weight:800;font-size:1.5rem;color:var(--mute)}
.ph.img i{display:none}
.pp.on .ph{transform:scale(1.1);box-shadow:0 0 0 .2rem #fff,0 .8rem 1.6rem rgba(0,0,0,.5)}
.pp b{font-size:.86rem;font-weight:600;line-height:1.25;color:#d6d6de}
.pp.on b{color:#fff}
.ap{position:relative;padding:6.2rem var(--pad) 3rem}
.ap-h{display:flex;align-items:center;gap:2.4rem;margin-bottom:2.4rem}
.ph.big{width:12rem;height:12rem;box-shadow:0 1.5rem 3rem rgba(0,0,0,.6)}
.ph.big i{font-size:3rem}
.ap h1{font:800 3.2rem/1.05 var(--ui);letter-spacing:-.035em;margin:.3rem 0 .4rem}
.ap .sub{color:var(--mute);margin-bottom:1.3rem}
.ap-out h3{font:700 1.2rem var(--ui);margin:2.6rem 0 1rem}
.ap-other{display:flex;flex-wrap:wrap;gap:.5rem}
.ap-other span{background:rgba(255,255,255,.07);padding:.42rem .85rem;border-radius:2rem;font-size:.86rem;color:#c3c3cc}
.ap-other small{color:var(--faint)}
/* lecteur web */
#player{position:fixed;inset:0;z-index:60;background:#000}
#player video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.pl-ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;opacity:0;transition:opacity .35s ease;background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent 18%,transparent 78%,rgba(0,0,0,.5))}
#player.ui .pl-ui{opacity:1}
.pl-top{display:flex;align-items:center;gap:1rem;padding:1.8rem var(--pad)}
.pl-top .t{flex:1;min-width:0}
.pl-top h3{margin:0;font:700 1.25rem var(--head);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .1rem .6rem rgba(0,0,0,.5)}
.pl-top span{color:rgba(255,255,255,.7);font-size:.85rem}
.pl-mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:2.2rem}
.pl-bot{padding:0 var(--pad) 2rem}
.pl-row{display:flex;align-items:center;gap:1rem;font-size:.82rem;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums}
.pl-bar{position:relative;flex:1;height:.3rem;border-radius:1rem;background:rgba(255,255,255,.22);cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:height .15s}
.pl-bar:hover{height:.45rem}
.pl-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:1rem;background:rgba(255,255,255,.95)}
.pl-bar b{position:absolute;top:50%;width:.8rem;height:.8rem;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 .6rem rgba(0,0,0,.4)}
.pl-b{width:3.6rem;height:3.6rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);color:#fff;transition:transform .15s,background .15s}
.pl-b:hover{background:rgba(255,255,255,.24)}
.pl-b:active{transform:scale(.92)}
.pl-b svg{width:1.6rem;height:1.6rem}
.pl-b.big{width:5rem;height:5rem}
.pl-b.big svg{width:2.2rem;height:2.2rem}
.pl-b.sm{width:2.8rem;height:2.8rem;background:rgba(255,255,255,.08)}
.pl-b.sm svg{width:1.15rem;height:1.15rem}
.pl-top .pl-b{width:2.6rem;height:2.6rem}
.pl-top .pl-b svg{width:1.1rem;height:1.1rem}
.live-pill{display:inline-flex;align-items:center;gap:.45rem;background:rgba(255,59,48,.9);color:#fff;font-weight:800;font-size:.72rem;letter-spacing:.12em;padding:.3rem .65rem;border-radius:2rem}
.pl-load{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.pl-load .sp{width:3rem;height:3rem;border-radius:50%;border:.3rem solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin 1s linear infinite}
.pl-err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding:2rem;background:rgba(0,0,0,.7)}
.pl-err b{font-size:1.4rem}
.pl-err span{color:var(--mute);max-width:36rem;line-height:1.5}
.zap{position:absolute;left:var(--pad);bottom:2.4rem;display:flex;align-items:center;gap:1.1rem;background:rgba(17,17,22,.92);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.4rem;min-width:26rem;max-width:60vw}
.zap .lg{width:4.4rem;height:2.9rem;border-radius:.5rem;background:var(--s2);display:grid;place-items:center;flex:none}
.zap .lg img{max-width:85%;max-height:78%;object-fit:contain}
.zap b{display:block;font-size:1.1rem}
.zap span{display:block;color:var(--mute);font-size:.85rem;margin-top:.15rem}

#toast{position:fixed;left:50%;bottom:2.5rem;transform:translate(-50%,1rem);z-index:90;background:#fff;color:#000;font-weight:600;padding:.8rem 1.3rem;border-radius:.8rem;opacity:0;transition:.25s;pointer-events:none;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* doigt ou souris : pas de cadre de télécommande */
@media (pointer:coarse){.f.on{box-shadow:none!important;transform:none!important}.inp.on{box-shadow:none!important}.btn.pri.on{box-shadow:none!important}}
/* Ma lecture, recherche, sagas */
.ptitle{font:800 2.4rem var(--head);letter-spacing:-.02em;margin:0 var(--pad) 1.2rem}
.mylec .stabs{margin:0 var(--pad) 1.4rem}
.mylec #ml,.srch #res{padding:0 var(--pad)}
.grid.wgrid{grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.grid.wgrid .card.wide2{width:auto}
.srch .sbox{margin-bottom:1rem}
.sline2{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;margin:0 var(--pad) .8rem}
.sline2 .lbl{color:var(--faint);font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;width:5.5rem}
.sline2 .chip small{color:var(--faint);font-weight:500;margin-left:.2rem}
.sline2 .chip.sel small{color:#555}
.gstat{color:var(--faint);font-size:.8rem;margin:0 var(--pad) 1rem;min-height:1em}
.rh{font:700 1.15rem var(--head);margin:1.2rem 0 .8rem}
.saga{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:1.6rem 1rem;padding:.4rem}
.sgi{position:relative;display:flex;flex-direction:column;gap:.4rem}
.sgi .card{width:auto}
.sgi .sgn{position:absolute;top:-.6rem;left:-.4rem;z-index:3;min-width:2rem;height:2rem;padding:0 .5rem;border-radius:2rem;background:var(--accent);font:800 .95rem/2rem var(--head);text-align:center;box-shadow:0 .3rem .8rem rgba(0,0,0,.5)}
.sgi .sgy{color:var(--mute);font-size:.82rem;text-align:center}
.sgi.small{flex:none;width:9.6rem}
.sgi.here .card{box-shadow:0 0 0 .18rem var(--accent)}
.sgmiss h3{font:700 1.15rem var(--head);margin:2.4rem 0 .9rem}
.ph-card.wide{width:16rem;aspect-ratio:16/9}
.card.wide2{width:16rem}
/* ===== Films / Séries : carrousel + grandes images ===== */
.bpage{padding:6.4rem 0 4rem}
.cflow{margin-bottom:1.6rem}
.cflow h3,.row h3{font-family:var(--head);font-weight:700;letter-spacing:-.01em}
.cflow h3{font-size:1.5rem;margin:0 var(--pad) .6rem}
.cf{display:flex;gap:0;overflow-x:auto;overflow-y:visible;scrollbar-width:none;padding:1.2rem calc(50% - 6.8rem) 1rem;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.cf::-webkit-scrollbar{display:none}
.qual{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-top:1rem}
.qual>span{color:var(--mute);font-size:.85rem;font-weight:600;margin-right:.3rem;text-transform:uppercase;letter-spacing:.06em}
.qual .chip.sel{background:var(--accent);color:#fff}
.mylb{position:relative;margin:.4rem var(--pad) 1.6rem;padding:1.1rem 0 .3rem;border-radius:1.4rem;background:linear-gradient(135deg,rgba(123,92,255,.28),rgba(123,92,255,.06) 55%,rgba(255,255,255,.03));border:1px solid rgba(160,140,255,.22);overflow:hidden}
.mylb::before{content:"";position:absolute;right:-4rem;top:-5rem;width:16rem;height:16rem;border-radius:50%;background:radial-gradient(circle,rgba(123,92,255,.45),transparent 70%);pointer-events:none}
.mylb-h{position:relative;display:flex;align-items:center;gap:.8rem;margin:0 1.2rem .5rem}
.mylb-h h3{margin:0;font:700 1.35rem var(--head)}
.mylb-h small{color:var(--mute);font-size:.85rem}
.mylb-ic{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;background:linear-gradient(135deg,#9B7CFF,#6A45F5);box-shadow:0 .4rem 1.2rem rgba(123,92,255,.55);color:#fff}
.mylb-ic .ic{width:1.25rem;height:1.25rem}
.mylb .strip{position:relative;padding-left:1.2rem;padding-right:1.2rem;scroll-padding:0 1.2rem}
.mylb .card.mylc{width:8.6rem;border-radius:.9rem;box-shadow:0 .5rem 1.2rem rgba(0,0,0,.45)}
.mylb .card.mylc.on{box-shadow:0 0 0 .2rem #B9A6FF,0 .8rem 1.8rem rgba(123,92,255,.5)}
.mylb-empty{flex:1;display:flex;flex-direction:column;gap:.3rem;padding:1rem 1.2rem;border-radius:1rem;border:1px dashed rgba(185,166,255,.4);color:var(--mute);font-size:.95rem}
.mylb-empty b{color:#fff;font-size:1.05rem}
.mylb-empty.on{border-color:#fff}
.cf .cfc{flex:none;width:13.6rem;margin:0 -.7rem;scroll-snap-align:center;scroll-snap-stop:normal;border-radius:1.2rem;transition:none;box-shadow:0 .8rem 1.6rem rgba(0,0,0,.45);transform-origin:50% 60%;will-change:transform,opacity;backface-visibility:hidden;contain:layout paint}
.cf .cfc.on{box-shadow:0 0 0 .22rem #fff,0 .8rem 1.6rem rgba(0,0,0,.45)}
.cf .cfc .rk{position:absolute;left:.7rem;bottom:.5rem;font:900 3.6rem/1 var(--head);color:#fff;text-shadow:0 .2rem 1rem rgba(0,0,0,.7)}
.cfi{text-align:center;padding:0 var(--pad);min-height:3.4rem}
.cfi b{display:block;font:700 1.35rem var(--head);letter-spacing:-.01em}
.cfi span{display:flex;gap:.9rem;justify-content:center;color:var(--mute);font-size:.88rem;margin-top:.3rem;flex-wrap:wrap}
.cfi span b{display:inline;font:inherit;color:#46D369}
.card.wide2{width:16rem;border-radius:1rem}
.card.wide2 .nm{font:700 1.05rem var(--head);padding:2.6rem 1rem .9rem;-webkit-line-clamp:2}
.card.wide2.poster img{object-position:center 22%}
.card.wide2 .bar{left:0;right:0;bottom:0;height:.28rem;border-radius:0}
.card.wide2 .bar i{background:#6FE3D0}
.row h3{font-size:1.3rem}
/* barre du haut / onglets : icônes seulement sur téléphone */
.tab .ic{display:none}
/* ===== look 2025 : menu en pastille, pages en rangées ===== */
#top{gap:1.2rem}
#top .logo{flex:1}
#top .grow{flex:1}
#tabs{flex:none;gap:.15rem;padding:.3rem;border-radius:2rem;background:rgba(20,20,28,.55);border:1px solid rgba(255,255,255,.08);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.tab{height:2.3rem;padding:0 1.15rem;border-radius:2rem;color:#c9c9d4;font-weight:600}
.tab.sel{background:rgba(255,255,255,.16);color:#fff}
.tab.sel::after{display:none}
.tab.on{background:#fff;color:#000}
#top .me{margin-left:.6rem}
.chip.big{height:2.5rem;padding:0 1.2rem;font-size:.92rem;background:rgba(255,255,255,.08);color:#e3e3ea;border:1px solid rgba(255,255,255,.06)}

"use strict";
/* =====================================================================
   Frigo Rosé IPTV — appli de lecture pour TA source IPTV (Xtream ou M3U)

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = encodeURIComponent;

  shield:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>',
  out:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3"/></svg>',

};
const COLORS = [["#8F73FF","#3D3BE0"],["#FF4D8D","#B5179E"],["#FF8A3D","#E0245E"],["#3DD6C1","#2463EB"],["#9B5CFF","#4B2AD8"],["#FFC93D","#FF6B3D"],["#5BE3A3","#138A6B"],["#8E9AAF","#3F4756"]];
const grad = i => { const c = COLORS[i % COLORS.length]; return `linear-gradient(135deg,${c[0]},${c[1]})`; };

/* ---------------- stockage ---------------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem("fi." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("fi." + k, JSON.stringify(v)); } catch (e) { } },
};
const IDB = (() => {
  let db = null;
  const open = () => db ? Promise.resolve(db) : new Promise((ok, ko) => {
    try {
      const r = indexedDB.open("friptv", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("cat");
      r.onsuccess = () => { db = r.result; ok(db); };
      r.onerror = () => ko(r.error);
    } catch (e) { ko(e); }
  });
  const run = (mode, fn) => open().then(d => new Promise((ok, ko) => {
    const t = d.transaction("cat", mode), s = t.objectStore("cat"), r = fn(s);
    t.oncomplete = () => ok(r && r.result); t.onerror = () => ko(t.error);
  }));
  return {
    get: k => run("readonly", s => s.get(k)).catch(() => null),
    set: (k, v) => run("readwrite", s => s.put(v, k)).catch(() => null),
    del: k => run("readwrite", s => s.delete(k)).catch(() => null),
  };
})();

const uid = () => Math.random().toString(36).slice(2, 10);
let PROFILES = LS.get("profiles", []);
let P = null;          // profil actif
let S = null;          // source active
let C = null;          // catalogue de la source active
const alive = () => PROFILES.filter(p => !p.del);
const saveProfiles = () => { LS.set("profiles", PROFILES); SYNC.push(); };
const progKey = () => "prog." + P.id;
const favKey = () => "fav." + P.id;
let PROG = {}, FAV = {};
const ikey = (k, id) => S.id + "|" + k + "|" + id;

/* ---------------- synchro entre appareils (par Studio, sur ton PC) ---------------- */
const SYNC = (() => {
  const tt = e => (e && typeof e === "object") ? (e.t || 0) : (e || 0);
  const base = () => VIA ? location.origin : String(LS.get("studio", "http://100.107.91.60:8795")).replace(/\/+$/, "");
  let state = "?", tm = 0, busy = false, again = false;
  function x(method, body, timeout) {
    return new Promise((ok, ko) => {
      const r = new XMLHttpRequest();
      try { r.open(method, base() + "/iptv/sync"); } catch (e) { return ko(e); }
      r.timeout = timeout || 6000;
      if (body) r.setRequestHeader("Content-Type", "text/plain;charset=UTF-8");
      r.onload = () => { if (r.status === 200) { try { ok(JSON.parse(r.responseText)); } catch (e) { ko(e); } } else ko(new Error("" + r.status)); };
      r.onerror = r.ontimeout = () => ko(new Error("net"));
      r.send(body || null);
    });
  }
  function local() {
    const prog = {}, fav = {}, favdel = {};
    alive().forEach(p => { prog[p.id] = LS.get("prog." + p.id, {}) || {}; fav[p.id] = LS.get("fav." + p.id, {}) || {}; favdel[p.id] = LS.get("favdel." + p.id, {}) || {}; });
    return { profiles: PROFILES, prog, fav, favdel };
  }
  // ce qui vient de Studio : pour chaque élément, la version la plus récente gagne
  function merge(r) {
    if (!r || typeof r !== "object") return false;
    let ch = false;
    const map = new Map(PROFILES.map(p => [p.id, p]));
    (r.profiles || []).forEach(p => { if (!p || !p.id) return; const o = map.get(p.id); if (!o || (p.u || 0) > (o.u || 0)) { map.set(p.id, p); ch = true; } });
    if (ch) { PROFILES = [...map.values()].sort((a, b) => (a.c || 0) - (b.c || 0) || String(a.id).localeCompare(String(b.id))); LS.set("profiles", PROFILES); }
    ["prog", "fav", "favdel"].forEach(k => Object.keys(r[k] || {}).forEach(pid => {

    <div class="stabs" data-z></div><div id="sg"></div></div>`;
  const tabs = $(".stabs", L), sg = $("#sg", L);
  [["cats", "Catégories"], ["view", "Affichage"]].forEach(([id, lab]) => {
    const c = h(`<button class="chip${id === tab ? " sel" : ""}">${lab}</button>`);
    f(c, () => openSettings(ret, id, kind)); tabs.appendChild(c);
  });
  const sw = on => `<span class="sw ${on ? "y" : ""}"></span>`;
  if (tab === "home") {
    sg.innerHTML = '<p class="hint2">Choisis les rangées de l\'accueil et leur ordre (⬆ ⬇).</p><div class="slist" data-z></div>';
    const box = $(".slist", sg);
    u.rows.forEach((r, i) => {
      const lab = (ROWDEF.find(d => d[0] === r.id) || [, r.id])[1];
      const line = h(`<div class="sline"><button class="mi">${sw(r.on)}<span>${esc(lab)}</span></button><button class="ib" aria-label="Monter">⬆</button><button class="ib" aria-label="Descendre">⬇</button></div>`);
      const [t, up, dn] = $$("button", line);
      f(t, () => { r.on = !r.on; save(); $(".sw", t).classList.toggle("y", r.on); });
      const mv = d => { const j = i + d; if (j < 0 || j >= u.rows.length) return; [u.rows[i], u.rows[j]] = [u.rows[j], u.rows[i]]; save(); openSettings(ret, "home"); focus($$(".sline", L)[j].querySelectorAll("button")[d < 0 ? 1 : 2]); };
      f(up, () => mv(-1)); f(dn, () => mv(1));
      box.appendChild(line);
    });
    const rz = h('<button class="btn" style="margin-top:1rem">Remettre l\'ordre de départ</button>');
    f(rz, () => { u.rows = []; UI(); save(); openSettings(ret, "home"); });
    sg.appendChild(rz);
  } else if (tab === "cats") {
    sg.innerHTML = `<div class="kinds" data-z></div><p class="hint2">★ épingle une catégorie : elle passe en premier et apparaît sur l'accueil. L'œil la masque partout.</p><div class="slist" data-z></div>`;
    const kinds = $(".kinds", sg);
    [["l", "TV en direct"], ["m", "Films"], ["s", "Séries"]].forEach(([k, lab]) => { if (!(C.cats[k] || []).length) return; const c = h(`<button class="chip${k === kind ? " sel" : ""}">${lab}</button>`); f(c, () => openSettings(ret, "cats", k)); kinds.appendChild(c); });
    const cnt = {}; (C[kind] || []).forEach(x => cnt[x.c] = (cnt[x.c] || 0) + 1);
    const box = $(".slist", sg);
    const all = catsOf(kind, true).filter(c => cnt[c[0]]);
    fill(box, all, c => {
      const pinned = () => u.pin[kind].indexOf(c[0]) >= 0, hidden = () => u.hide[kind].indexOf(c[0]) >= 0;
      const line = h(`<div class="sline${hidden() ? " off" : ""}"><span class="cn">${esc(clean(c[1]))}<small>${cnt[c[0]]}</small></span><button class="ib pin${pinned() ? " y" : ""}" aria-label="Épingler">★</button><button class="ib eye" aria-label="Masquer">${hidden() ? "Masquée" : "Visible"}</button></div>`);
      const [pb, eb] = $$("button", line);
      f(pb, () => { const a = u.pin[kind], i = a.indexOf(c[0]); i >= 0 ? a.splice(i, 1) : a.push(c[0]); if (i < 0) { const j = u.hide[kind].indexOf(c[0]); if (j >= 0) u.hide[kind].splice(j, 1); } save(); pb.classList.toggle("y", pinned()); eb.textContent = hidden() ? "Masquée" : "Visible"; line.classList.toggle("off", hidden()); });
      f(eb, () => { const a = u.hide[kind], i = a.indexOf(c[0]); i >= 0 ? a.splice(i, 1) : a.push(c[0]); if (i < 0) { const j = u.pin[kind].indexOf(c[0]); if (j >= 0) u.pin[kind].splice(j, 1); } save(); eb.textContent = hidden() ? "Masquée" : "Visible"; line.classList.toggle("off", hidden()); pb.classList.toggle("y", pinned()); });
      return line;
    }, 80);
    const rz = h('<button class="btn" style="margin-top:1rem">Tout réafficher</button>');
    f(rz, () => { u.hide[kind] = []; save(); openSettings(ret, "cats", kind); });
    sg.appendChild(rz);
  } else {
    sg.innerHTML = '<div class="mlist" data-z></div>';
    const box = $(".mlist", sg);
    const tg = (label, get, set) => { const b = h(`<button class="mi"><span>${label}</span>${sw(get())}</button>`); f(b, () => { set(!get()); save(); $(".sw", b).classList.toggle("y", get()); }); box.appendChild(b); };
    tg("Afficher les titres sous les affiches", () => !!u.names, v => u.names = v);
    tg("Seulement les catégories françaises", () => frOnly(), v => { u.fronly = v; FRCHANGED = true; });
    tg("Cacher les catégories pour adultes", () => !P.adult, v => P.adult = !v);
    tg("Regrouper les doublons (4K, Full HD, HD…)", () => u.dup !== false, v => u.dup = v);
    const qL = { fhd: "Full HD", "4k": "4K", hd: "HD" };
    const qb = h(`<button class="mi"><span>Qualité préférée</span><small>${qL[u.q || "fhd"]}</small></button>`);
    f(qb, () => { const o = ["fhd", "4k", "hd"], n = o[(o.indexOf(u.q || "fhd") + 1) % o.length]; u.q = n; save(); $("small", qb).textContent = qL[n]; });
    box.appendChild(qb);
    const fmtL = { auto: "Automatique", ts: "MPEG-TS", hls: "HLS (m3u8)" };
    const fm = h(`<button class="mi"><span>Format des chaînes</span><small>${fmtL[LS.get("livefmt", "auto")]}</small></button>`);
    f(fm, () => { const o = ["auto", "ts", "hls"], c = LS.get("livefmt", "auto"); const n = o[(o.indexOf(c) + 1) % o.length]; LS.set("livefmt", n); $("small", fm).textContent = fmtL[n]; });
    box.appendChild(fm);
  }
  L._close = () => {
    L.hidden = true;
    if (FRCHANGED) { FRCHANGED = false; MENU_DIRTY = false; enterProfile(P, true); return; }
    if (MENU_DIRTY) { MENU_DIRTY = false; indexCatalog(); drawTop(); go(TAB); } else if (ret && ret.isConnected) focus(ret);
  };
  focus($(".stabs .chip.sel", L));
}
function closeAll() { ["fiche", "menu", "edit"].forEach(i => $("#" + i).hidden = true); }

/* ---------------- touches ---------------- */
let lastBack = 0;
function back() {
  if (!$("#player").hidden) return plClose();
  if (!$("#edit").hidden) { const x = $("#se-x") || $("#pe-x"); if (x) x._ok(); else $("#edit").hidden = true; return; }
  if (!$("#menu").hidden) { const L = $("#menu"); L._close ? L._close() : (L.hidden = true); return; }
  if (!$("#fiche").hidden) return ficheBack();
  if (CATV && !$("#app").hidden) return closeCat();
  if (!$("#app").hidden) {
    const inTop = CUR && CUR.closest("#top");
    if (!inTop) { const v = $("#view"); v.scrollTop = 0; return focus($(".tab.sel") || $("#t-search")); }
    if (TAB !== firstTab()) return go(firstTab());
    if (Date.now() - lastBack < 2500 && window.FRIPTV && FRIPTV.exit) return FRIPTV.exit();
    lastBack = Date.now(); if (window.FRIPTV && FRIPTV.exit) toast("Appuie encore sur Retour pour quitter");
    return;
  }
  if (!$("#who").hidden && P && C) { $("#who").hidden = true; $("#app").hidden = false; go(TAB); }
}
let holdT = 0, holdDone = true;
// l'appli télé envoie le bouton OK elle-même, sauf quand on écrit dans un champ
document.addEventListener("focusin", e => { if (window.FRIPTV && FRIPTV.typing) FRIPTV.typing(!!(e.target && /INPUT|TEXTAREA/.test(e.target.tagName))); });
document.addEventListener("focusout", () => { if (window.FRIPTV && FRIPTV.typing) FRIPTV.typing(false); });
const isOk = e => e.key === "Enter" || e.key === " " || e.key === "Select" || e.keyCode === 13 || e.keyCode === 23;
let okDown = false;
document.addEventListener("keyup", e => {
  // si la télé n'a envoyé que le relâchement du bouton OK
  if (isOk(e) && !okDown && $("#player").hidden && !(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) && $("#boot").hidden) { e.preventDefault(); ok(); return; }
  if (isOk(e)) okDown = false;
  if (isOk(e) && CUR && CUR._long && !holdDone && $("#player").hidden && !(e.target && /INPUT/.test(e.target.tagName))) { holdDone = true; clearTimeout(window._holdTm); ok(); }
});
document.addEventListener("keydown", e => {
  let k = e.key;
  if (isOk(e)) { k = "Enter"; okDown = true; }
  if (k === "Backspace" && !(e.target && /INPUT|TEXTAREA/.test(e.target.tagName))) k = "Escape";
  if (e.keyCode === 4 || k === "GoBack" || k === "BrowserBack") k = "Escape";
  const typing = e.target && /INPUT|TEXTAREA/.test(e.target.tagName);
  if (typing) {
    if (k === "Escape" || k === "ArrowDown" || k === "ArrowUp" || (k === "Enter" && e.target.id !== "q")) { e.preventDefault(); e.target.blur(); if (k === "ArrowDown" || k === "ArrowUp") move(k === "ArrowDown" ? "down" : "up"); else if (k === "Enter") move("down"); }
    return;
  }
  if (!$("#player").hidden) { e.preventDefault(); return plKey(k); }
  if (!$("#boot").hidden) return;
  const dirs = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
  if (dirs[k]) {
    e.preventDefault();
    move(dirs[k]);
    // en bas d'une grande grille : on ajoute la suite
    const g = CUR && CUR.parentElement; if (g && g._more && dirs[k] === "down") { const items = g.children, idx = [...items].indexOf(CUR); if (idx > items.length - 24) g._more(); }
    return;
  }
  if ((k === "Enter" || k === " ") && CUR && CUR._long && layer().contains(CUR)) {
    e.preventDefault();
    if (!e.repeat) { holdT = Date.now(); holdDone = false; const el = CUR; clearTimeout(window._holdTm); window._holdTm = setTimeout(() => { if (!holdDone && CUR === el) { holdDone = true; el._long(); } }, 650); }
    else if (!holdDone && Date.now() - holdT > 600) { holdDone = true; clearTimeout(window._holdTm); CUR._long(); }
    return;
  }
  if (k === "Enter" || k === " ") { e.preventDefault(); return ok(); }
  if (k === "Escape") { e.preventDefault(); return back(); }
  if (k === "MediaPlayPause" && CUR && CUR._ok) return ok();
});
// clic de souris / doigt : le focus suit
document.addEventListener("mousedown", e => { const el = e.target.closest && e.target.closest(".f"); if (el && layer().contains(el)) focus(el, { noscroll: true }); });
window.addEventListener("popstate", () => { });

/* ---------------- démarrage ---------------- */
(async function boot() {
  $("#boot-msg").textContent = "Synchronisation…";
  await SYNC.pull(3500);
  $("#boot-msg").textContent = "";
  setInterval(() => { if (document.hidden) return; SYNC.pull(5000).then(ch => { if (ch && !$("#who").hidden) showWho(false); }); }, 120000);
  if (SYNC.state() !== "ok") { let n = 0; const rt = setInterval(() => { if (++n > 12 || SYNC.state() === "ok") return clearInterval(rt); SYNC.pull(6000).then(ch => { if (ch && !$("#who").hidden) showWho(false); }); }, 8000); }
  if (!alive().length) {
    $("#boot").hidden = true;
    showWho(false);
    $("#who h1").textContent = "Bienvenue ! Crée ton profil";
    focus($(".prof"));
    return;
  }
  $("#boot").hidden = true;
  if (alive().length === 1 && LS.get("skipwho", false)) return enterProfile(alive()[0]);
  showWho(false);
})();
</script>
