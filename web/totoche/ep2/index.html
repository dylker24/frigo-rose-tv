<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Inspecteur Totoche — Le Mariage</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inspecteur Totoche">
<meta name="theme-color" content="#0c0c10">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Special+Elite&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0c0c10;color:#f2f2f7;font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}
:root{--acc:#e8a33d;--bg:#0c0c10;--card:#16161c;--line:#ffffff12;--mut:#8e8e98;--red:#ff5a4f;--green:#3ecf7a}
#app{position:fixed;inset:0;display:flex;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.tw{font-family:'Special Elite',monospace}

/* nav */
nav{width:236px;flex-shrink:0;background:#101015;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow-y:auto}
nav .brand{padding:6px 10px 18px}
nav .brand small{color:var(--acc);font-size:10.5px;letter-spacing:3px}
nav .brand b{display:block;font-size:22px;font-weight:800;line-height:1.05;margin-top:4px}
.nb{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:0;background:none;font-size:15px;font-weight:600;text-align:left;position:relative;color:#c9c9d1}
.nb .i{font-size:19px;width:24px;text-align:center}
.nb.on{background:#ffffff10;color:#fff}
.nb .dot{position:absolute;right:12px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
nav .sp{flex:1}
.nb.mcall{background:#1e3a26;color:#bff5d2;margin-top:6px}
.nb.quit{color:var(--mut);font-size:13.5px}
main{flex:1;min-width:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px 30px 120px;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1.vt{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.vs{color:var(--mut);font-size:14.5px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card h3{font-size:16px;margin-bottom:8px}
.lbl{font-size:11.5px;letter-spacing:2px;color:var(--acc);font-weight:700;margin-bottom:8px;display:block}
.mut{color:var(--mut)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

@media (max-width:760px){
  #app{flex-direction:column-reverse}
  nav{width:100%;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);overflow-x:auto;gap:2px}
  nav .brand,nav .sp,.nb.quit{display:none}
  .nb{flex-direction:column;gap:2px;font-size:10px;padding:6px 8px;min-width:60px;align-items:center}
  .nb .dot{top:4px;right:10px}
  .nb.mcall{margin:0}
  .view{padding:18px 16px 40px}
  .row2{grid-template-columns:1fr}
}

/* objectives */
.obj{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.obj:last-child{border:0}
.obj .c{width:22px;height:22px;border-radius:50%;border:2px solid #444;flex-shrink:0;display:grid;place-items:center;font-size:12px;margin-top:1px}
.obj.ok .c{background:var(--green);border-color:var(--green);color:#000}
.obj.ok span{color:var(--mut);text-decoration:line-through}
.suspects{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.sus{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0}
.sus img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.sus div{padding:10px 12px}
.sus b{display:block;font-size:15px}.sus small{color:var(--mut);font-size:12.5px}
.sus.lock{opacity:.4}

/* messages */
.split{display:flex;gap:16px;height:100%}
.list{width:260px;flex-shrink:0}
.th{display:flex;gap:12px;padding:12px;border-radius:14px;align-items:center;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.th.on,.th:hover{background:#ffffff0c}
.av{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:700;font-size:17px;overflow:hidden;background:#333}
.av img{width:100%;height:100%;object-fit:cover}
.th .m{flex:1;min-width:0}.th b{font-size:15px;display:block}.th small{color:var(--mut);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{flex:1;background:var(--card);border-radius:18px;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:6px;min-height:400px}
.chat .hd{font-weight:700;font-size:17px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.day{text-align:center;font-size:12px;color:var(--mut);margin:12px 0 4px;font-weight:600}
.b{max-width:75%;padding:10px 14px;border-radius:19px;font-size:15.5px;line-height:1.4}
.b.in{background:#26262e;align-self:flex-start;border-bottom-left-radius:6px}
.b.out{background:#2f6fdb;align-self:flex-end;border-bottom-right-radius:6px}
.b small{display:block;font-size:11px;opacity:.6;margin-top:3px}
.read{align-self:flex-end;font-size:11.5px;color:var(--mut)}
@media (max-width:760px){.split{flex-direction:column;height:auto}.list{width:100%}}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{border:0;padding:0;background:#222;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:1}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .tm{position:absolute;left:8px;bottom:8px;background:#000a;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:700}
.ph .nw{position:absolute;right:8px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.viewer{position:fixed;inset:0;background:#000e;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.vbox{display:flex;gap:22px;max-width:980px;width:100%;align-items:center}
.vimg{position:relative;flex:1;max-width:560px}
.vimg img{width:100%;border-radius:14px;display:block}
.hot{position:absolute;border:2px dashed var(--acc);border-radius:50%;background:#e8a33d22;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px #e8a33d00;background:#e8a33d44}}
.vinfo{width:300px;font-size:15px;line-height:1.5}
.vinfo h3{font-size:20px;margin-bottom:6px}
.tag{display:inline-block;background:#ffffff14;padding:4px 10px;border-radius:20px;font-size:13px;margin:3px 4px 3px 0}
.tag.unk{background:#ff5a4f22;color:#ff9b93}
.x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:18px;background:#ffffff1c;border:0;width:44px;height:44px;border-radius:50%;font-size:20px;z-index:41}
@media (max-width:760px){.vbox{flex-direction:column}.vinfo{width:100%}}

/* insta */
.ig{max-width:560px}
.igtabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.igtab{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;font-size:12px;width:76px}
.igtab .ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
.igtab.on .ring{background:var(--acc)}
.igtab .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg)}
.post{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px}
.post .ph2{display:flex;gap:10px;align-items:center;padding:10px 12px;font-weight:700;font-size:14px}
.post .ph2 .av{width:32px;height:32px}
.post>img{width:100%;display:block}
.post .pb{padding:10px 14px 14px;font-size:14.5px;line-height:1.45}
.post .cm{margin-top:8px;color:#d6d6de}
.post .cm div{margin-top:4px}
.post .tt{color:var(--mut);font-size:12px;margin-top:6px}
.bio{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.bio .av{width:76px;height:76px}
/* fb */
.fbcover{height:150px;border-radius:16px;background:url(cour.jpg) center/cover;position:relative;margin-bottom:56px}
.fbcover .av{position:absolute;left:20px;bottom:-44px;width:96px;height:96px;border:4px solid var(--bg)}
.fbname{font-size:24px;font-weight:800}
.fbpost{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;max-width:620px}
.fbpost .hdp{display:flex;gap:10px;align-items:center;margin-bottom:10px}.fbpost .hdp .av{width:38px;height:38px}
.fbpost p{font-size:15.5px;line-height:1.45}
.fbpost img{width:100%;border-radius:10px;margin-top:10px}
.fbpost .cms{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.fbc{display:flex;gap:8px;font-size:14px}.fbc .av{width:30px;height:30px;font-size:12px}.fbc div div{background:#ffffff0e;border-radius:14px;padding:7px 12px}

/* dossier */
.log{font-family:'Special Elite',monospace;font-size:15px;line-height:2}
.log .hl{color:var(--acc)}
.locked{opacity:.5;text-align:center;padding:30px}

/* interro */
.room{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 30% 0%,#2a2014,#0c0c10 60%)}
.rhead{display:flex;gap:18px;align-items:center;padding:20px 26px 14px;border-bottom:1px solid var(--line)}
.rhead img{width:92px;height:92px;border-radius:18px;object-fit:cover}
.rhead h2{font-size:24px}
.stress{margin-top:8px;width:200px;height:8px;border-radius:5px;background:#ffffff14;overflow:hidden}
.stress i{display:block;height:100%;background:linear-gradient(90deg,#3ecf7a,#e8a33d,#ff5a4f);transition:width .6s}
.rlog{flex:1;overflow-y:auto;padding:18px 26px;display:flex;flex-direction:column;gap:10px}
.say{max-width:78%;padding:12px 16px;border-radius:18px;font-size:16px;line-height:1.45;animation:fade .3s}
.say.s{background:#24242c;align-self:flex-start;border-bottom-left-radius:6px}
.say.l{background:#3a2a10;color:#ffe2b3;align-self:flex-end;border-bottom-right-radius:6px}
.say.sys{align-self:center;background:none;color:var(--acc);font-size:13.5px;text-align:center}
.say.ev{align-self:flex-end;background:#1e3a26;color:#bff5d2}
.say.br{border:2px solid var(--red)}
.rbar{padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0c0c10ee;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex-shrink:0;border:1px solid #ffffff22;background:#ffffff0a;border-radius:20px;padding:9px 14px;font-size:14px}
.chip.used{opacity:.45}
.inrow{display:flex;gap:10px}
.inrow input{flex:1;min-width:0;background:#1a1a20;border:1px solid #ffffff1c;border-radius:14px;padding:13px 14px;color:#fff;font-size:16px;font-family:inherit;-webkit-user-select:text;user-select:text}
.btn{border:0;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:700;background:#ffffff14}
.btn.acc{background:var(--acc);color:#1a1208}
.btn.mic{background:#2f6fdb;color:#fff;min-width:54px}
.btn.mic.on{background:var(--red);animation:pulse 1s infinite}
.btn.big{width:100%;padding:16px;font-size:17px}
.btn:disabled{opacity:.4}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#000c;padding:20px;animation:fade .2s}
.modal{background:#17171d;border:1px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto}
.modal h2{font-size:22px;margin-bottom:6px}
.evi{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--line);margin-top:8px;background:#ffffff06;width:100%;text-align:left}
.evi .ic{font-size:22px}.evi b{display:block;font-size:15px}.evi small{color:var(--mut);font-size:13.5px;line-height:1.4;display:block;margin-top:2px}
.evi.sel{border-color:var(--acc);background:#e8a33d18}
.call{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,#1b2a3a,#0b0f16);display:flex;flex-direction:column;align-items:center;padding:calc(60px + env(safe-area-inset-top)) 24px 50px;animation:fade .3s}
.call img{width:130px;height:130px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 8px #ffffff10}
.call h2{font-size:28px;margin-top:20px}.call .st{color:#a9b8c8;margin-top:4px}
.call .sub{margin-top:30px;max-width:620px;font-size:19px;line-height:1.5;text-align:center;min-height:120px}
.call .acts{margin-top:auto;display:flex;gap:60px}
.cb{width:76px;height:76px;border-radius:50%;border:0;font-size:30px;display:grid;place-items:center}
.cb.g{background:#34c759}.cb.r{background:#ff3b30}
.ring img{animation:ringpulse 1.2s infinite}
@keyframes ringpulse{50%{box-shadow:0 0 0 20px #34c75922}}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:#1e3a26;color:#d6ffe6;padding:12px 18px;border-radius:16px;font-weight:600;font-size:14.5px;z-index:70;transition:transform .35s;box-shadow:0 10px 30px #0008;max-width:90%}
#toast.show{transform:translate(-50%,0)}

/* intro / end */
.intro{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,#0c0c10cc,#0c0c10 70%),url(cour.jpg) center/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:40px max(28px,calc(50% - 320px)) calc(40px + env(safe-area-inset-bottom));gap:16px}
.intro h1{font-size:54px;font-weight:800;letter-spacing:-2px;line-height:1}
.intro p{color:#d0d0d8;font-size:17px;line-height:1.55}
.paper{font-family:'Special Elite',monospace;background:#f3ead8;color:#2b2118;padding:18px;border-radius:4px;transform:rotate(-.6deg);font-size:14.5px;line-height:1.65}
.choice{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.choice button{text-align:left;padding:16px;border-radius:14px;border:1px solid #ffffff22;background:#ffffff0a;font-size:15.5px;line-height:1.4}
.choice button b{display:block;margin-bottom:3px}
.stamp{font-family:'Special Elite',monospace;border:3px solid var(--green);color:var(--green);display:inline-block;padding:6px 14px;transform:rotate(-5deg);font-size:22px;letter-spacing:2px}
</style>
</head>
<body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="ov"></div>
<div id="callov"></div>
<div id="toast"></div>

let ringT;
function ringStart(){const a=ac();if(!a)return;let n=0;
  const beep=()=>{[0,0.4].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=n%2?480:440;o.type='sine';g.gain.setValueAtTime(0,a.currentTime+d);g.gain.linearRampToValueAtTime(.12,a.currentTime+d+.03);g.gain.linearRampToValueAtTime(0,a.currentTime+d+.35);o.connect(g);g.connect(a.destination);o.start(a.currentTime+d);o.stop(a.currentTime+d+.4)});n++};
  beep();ringT=setInterval(beep,2200)}
function ringStop(){clearInterval(ringT)}
function blip(f=880){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.25);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.3)}

let toastT;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),3200)}
function addEv(id){if(!id||S.ev[id])return;S.ev[id]=Date.now();save();blip(1040);toast(EV[id].ic+' Preuve ajoutée : '+EV[id].t);triggers()}
function evCount(){return Object.keys(S.ev).length}
function triggers(){
  if(!S.calls[2]&&evCount()>=5&&!pendingCall)setTimeout(()=>incoming(2),2500);
  else if(S.calls[2]&&!S.calls[3]&&(S.ev.hugoAveu||S.ev.lucieTemoin||evCount()>=11)&&!pendingCall)setTimeout(()=>incoming(3),3000);
  else if(S.calls[3]&&!S.calls[4]&&S.ev.lucieTemoin&&!pendingCall)setTimeout(()=>incoming(4),3000);
}

// ================= APPELS =================
let pendingCall=null,callAbort=false;
function incoming(n){if(S.calls[n]||pendingCall)return;pendingCall=n;
  $('callov').innerHTML=`<div class="call ring" id="callbox"><img src="morel.jpg"><h2>Capitaine Morel</h2><div class="st">Appel entrant…</div><div class="sub"></div>
  <div class="acts"><button class="cb r" onclick="declineCall()">✕</button><button class="cb g" onclick="answerCall()">📞</button></div></div>`;ringStart()}
function declineCall(){ringStop();const n=pendingCall;pendingCall=null;$('callov').innerHTML='';toast('📞 Morel rappellera dans un instant…');setTimeout(()=>incoming(n),20000)}
async function answerCall(){ringStop();ac();const n=pendingCall;callAbort=false;
  const c=$('callbox');c.classList.remove('ring');c.querySelector('.st').textContent='En ligne';
  c.querySelector('.acts').innerHTML='<button class="cb r" onclick="hangup()">✕</button>';
  const sub=c.querySelector('.sub');
  for(const line of CALLS[n]){if(callAbort)break;sub.textContent='« '+line+' »';await speak(line,'morel');await new Promise(r=>setTimeout(r,250))}
  endCall(n)}
function hangup(){callAbort=true;shush();endCall(pendingCall)}
function endCall(n){if(!pendingCall)return;S.calls[n]=Date.now();pendingCall=null;
  if(n===2)addEv('legiste');save();$('callov').innerHTML='';render();setTimeout(triggers,500);if(n===1)toast('🗂️ Commence par le Dossier et les Messages');}
async function callMorel(){
  ac();const h=HINTS.find(x=>x[0]())[1];S.hints++;save();
  $('callov').innerHTML=`<div class="call"><img src="morel.jpg"><h2>Capitaine Morel</h2><div class="st">En ligne</div><div class="sub">« ${h} »</div>
  <div class="acts"><button class="cb r" onclick="shush();$('callov').innerHTML=''">✕</button></div></div>`;
  await speak('Un conseil, Léna. '+h,'morel');
}

function susAvail(s){return s!=='marco'||S.calls[3]}

function vRoom(){
  const s=curSus,st=S.it[s],it=IT[s];
  const tops=it.topics.filter(t=>!t.need||S.ev[t.need]);
  return `<div class="room"><div class="rhead"><button class="btn" onclick="shush();curSus=null;render()">‹</button><img src="${P[s].img}"><div><h2>${P[s].n}</h2><div class="mut">${P[s].r}</div><div class="stress" title="Nervosité"><i style="width:${Math.min(100,st.stress)}%"></i></div></div></div>
  <div class="rlog" id="rlog">${st.log.map(l=>`<div class="say ${l[0]}${l[2]?' br':''}">${l[1]}</div>`).join('')}</div>
  <div class="rbar"><div class="chips">${tops.map(t=>`<button class="chip ${st.used[t.id]?'used':''}" onclick="ask('${t.id}')">${t.l}</button>`).join('')}</div>
  <div class="inrow"><button class="btn mic" id="micb" onclick="toggleMic()">🎙️</button><input id="q" placeholder="Pose ta question…" onkeydown="if(event.key==='Enter')askText()"><button class="btn" onclick="askText()">➤</button><button class="btn acc" onclick="presentPick()">📌 Preuve</button></div></div></div>`}
let busy=false;
async function suspectSays(text,brk){const st=S.it[curSus];st.log.push(['s',text,brk?1:0]);save();render();await speak(text,curSus)}
function ask(tid,said){if(busy)return;const s=curSus,st=S.it[s],t=IT[s].topics.find(x=>x.id===tid);
  st.log.push(['l',said||t.l]);st.used[tid]=1;busy=true;
  setTimeout(async()=>{await suspectSays(t.a);(t.give||[]).forEach(addEv);busy=false},450)}
function askText(){const i=$('q');const v=i.value.trim();if(!v)return;i.value='';handleSpeech(v)}
function handleSpeech(v){if(busy)return;const s=curSus,it=IT[s],n=norm(v);
  const tops=it.topics.filter(t=>!t.need||S.ev[t.need]);
  let best=null,bs=0;tops.forEach(t=>{const sc=t.kw.reduce((a,k)=>a+(n.includes(norm(k))?1:0),0);if(sc>bs){bs=sc;best=t}});
  if(best)ask(best.id,v);
  else{const st=S.it[s];st.log.push(['l',v]);busy=true;setTimeout(async()=>{await suspectSays(it.def[Math.floor(Math.random()*it.def.length)]);busy=false},400)}}
function presentPick(){
  const ids=Object.keys(S.ev);
  $('ov').innerHTML=`<div class="ov" onclick="if(event.target===this)this.remove()"><div class="modal"><h2>Présenter une preuve</h2><div class="mut">À ${P[curSus].n}</div>
  ${ids.length?ids.map(id=>`<button class="evi" onclick="present('${id}')"><span class="ic">${EV[id].ic}</span><div><b>${EV[id].t}</b><small>${EV[id].d}</small></div></button>`).join(''):'<p class="mut" style="margin-top:14px">Tu n’as encore aucune preuve. Fouille les messages, photos et réseaux !</p>'}
  <button class="btn big" style="margin-top:14px" onclick="$('ov').innerHTML=''">Annuler</button></div></div>`}
function present(id){$('ov').innerHTML='';if(busy)return;const s=curSus,st=S.it[s],c=IT[s].contra[id];
  st.log.push(['ev','📌 '+EV[id].t]);busy=true;
  setTimeout(async()=>{
    let txt,brk=false,give=[];
    if(!c){txt=['Et alors ? Ça ne prouve rien.','Je ne vois pas ce que ça a à voir avec moi.','Hmm. Et ?'][Math.floor(Math.random()*3)]}
    else if(c.after&&!st.shown[c.after]){txt=c.pre}
    else{txt=c.a;brk=!!c.brk;give=c.give||[];st.stress=Math.max(0,st.stress+(c.s||0))}
    st.shown[id]=1;if(brk){st.broke=1;st.log.push(['sys','💥 '+P[s].n.split(' ')[0]+' craque !'])}
    await suspectSays(txt,brk);give.forEach(addEv);busy=false;
  },500)}
// micro
let rec=null,recOn=false;
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('🎙️ Micro indisponible ici : active la dictée dans Réglages > Général > Clavier, ou écris ta question');$('q').focus();return}
  if(recOn){try{rec.stop()}catch(e){}return}
  shush();rec=new SR();rec.lang='fr-FR';rec.interimResults=true;rec.continuous=false;
  rec.onstart=()=>{recOn=true;$('micb').classList.add('on');$('q').placeholder='Je t’écoute…'};
  rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;$('q').value=t;if(e.results[e.results.length-1].isFinal){$('q').value='';handleSpeech(t)}};
  rec.onerror=e=>{if(e.error==='not-allowed')toast('🎙️ Autorise le micro dans les réglages de Safari')};
  rec.onend=()=>{recOn=false;const b=$('micb');if(b)b.classList.remove('on');const q=$('q');if(q)q.placeholder='Pose ta question…'};
  try{rec.start()}catch(e){}
}

async function arrest(s){$('ov').innerHTML='';
  let line;
  if(s==='bastien'&&S.ev.aveuBastien){S.ending=true;S.ch={};save();render();return}
  if(s==='bastien')line='Bastien, je suis d’accord. Mais le procureur refuse : sans témoin ni aveu, son avocat va le sortir en une heure. Fais-le craquer d’abord.';
  else{S.errors++;line={camille:'Camille ?! Elle était sur la piste, Léna. Tu viens d’arrêter une jeune mariée en deuil. On la relâche.',hugo:'Hugo a menti, oui. Mais Gérard était déjà mort quand il est arrivé. On le relâche.',nathalie:'Nathalie avait un mobile, mais elle était sur la piste à l’heure du crime. On la relâche.',lucie:'Lucie ? Elle a peur, elle cache quelque chose… mais ce n’est pas elle. On la relâche. Fais-la parler plutôt.'}[s]}
  save();
  $('callov').innerHTML=`<div class="call"><img src="morel.jpg"><h2>Capitaine Morel</h2><div class="st">En ligne</div><div class="sub">« ${line} »</div><div class="acts"><button class="cb r" onclick="shush();$('callov').innerHTML='';render()">✕</button></div></div>`;
  await speak(line,'morel');
}

// ---------- Fin ----------
const CHOICES=[
 {k:'b',q:'Bastien est menotté. Que demandes-tu au procureur ?',o:[
   ['meurtre','Mise en examen pour meurtre','Pas de cadeau. Trente ans d’amitié n’excusent rien.'],
   ['marche','Lui proposer un marché','Il rembourse tout et dénonce le comptable qui l’a aidé à cacher l’argent, en échange d’une requalification.']]},
 {k:'l',q:'Lucie t’a supplié de garder son secret. Que fais-tu ?',o:[
   ['reveler','Tout révéler à Camille','Elle a le droit de savoir qu’elle a une sœur.'],
   ['secret','Garder le secret de Lucie','C’est à Lucie de choisir quand le dire.']]},
 {k:'h',need:'hugoAveu',q:'Hugo a laissé le corps de Gérard sans rien dire. Et lui ?',o:[
   ['poursuivre','Le poursuivre','Mentir à la police et fuir un corps, ça a des conséquences.'],
   ['fermer','Fermer les yeux','Gérard était déjà mort. Il a eu peur, c’est tout.']]}
];
const ENDTXT={
 meurtre:'Bastien Roche est mis en examen pour meurtre et abus de biens sociaux. Au procès, il n’a jamais regardé Camille dans les yeux.',
 marche:'Bastien a tout balancé : le comptable, les comptes en Suisse, les fausses factures. Les 1,2 million sont revenus à l’entreprise, que Camille dirige désormais. Le juge a retenu l’homicide involontaire.',
 reveler:'Camille et Lucie se sont regardées longtemps sans rien dire. Puis Camille l’a prise dans ses bras. Depuis, elles déjeunent ensemble tous les dimanches, à Rouffignac.',
 secret:'Lucie est partie avant l’aube. Elle a laissé une lettre pour Camille, à ouvrir « quand tu seras prête ». Camille ne l’a pas encore ouverte.',
 poursuivre:'Hugo a pris du sursis pour non-assistance et faux témoignage. Camille a mis six mois à lui reparler.',
 fermer:'Hugo a juré à Camille de ne plus jamais lui mentir. Et de ne plus jamais remettre les pieds dans un casino.'
};
function renderEnd(){
  $('nav').innerHTML='';shush();
  const next=CHOICES.find(c=>!S.ch[c.k]&&(!c.need||S.ev[c.need]));
  if(next){$('main').innerHTML=`<div class="view" style="max-width:640px;margin:0 auto;position:relative;padding-top:50px">
    <div class="tw" style="color:var(--acc);letter-spacing:2px">INTERPELLATION</div><h1 class="vt" style="margin:8px 0 14px">${next.q}</h1>
    <div class="choice">${next.o.map(o=>`<button onclick="S.ch['${next.k}']='${o[0]}';save();render()"><b>${o[1]}</b><span class="mut">${o[2]}</span></button>`).join('')}</div></div>`;return}
  const mins=Math.round((Date.now()-S.start)/60000);
  const sc=S.errors*2+S.hints;const rank=sc===0?'Commissaire divisionnaire ⭐⭐⭐':sc<=3?'Commissaire ⭐⭐':sc<=7?'Lieutenante ⭐':'Stagiaire (mais elle a trouvé !)';
  const txt=[ENDTXT[S.ch.b],ENDTXT[S.ch.l],S.ch.h?ENDTXT[S.ch.h]:''].filter(Boolean);
  S.done=true;S.finished=S.finished||Date.now();save();
  $('main').innerHTML=`<div class="view" style="max-width:660px;margin:0 auto;position:relative;padding-top:50px;text-align:center">
  <div class="stamp">AFFAIRE RÉSOLUE</div><h1 class="vt" style="margin:20px 0">Bastien Roche a tué Gérard Beaulieu.</h1>
  ${txt.map(t=>`<p style="font-size:17px;line-height:1.6;color:#d6d6de;margin-bottom:16px;text-align:left">${t}</p>`).join('')}
  <div class="paper" style="text-align:left;margin:20px 0">Durée de l’enquête : ${mins} min<br>Preuves trouvées : ${evCount()}/${Object.keys(EV).length}<br>Fausses arrestations : ${S.errors}<br>Appels à Morel : ${S.hints}<br>Grade : ${rank}</div>
  <button class="btn acc big" onclick="location.href='../'">Retour aux épisodes</button>
  <button class="btn big" style="margin-top:10px;opacity:.7" onclick="restart(this)">Recommencer l’épisode</button></div>`;
}
function restart(b){if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Sûre ? Appuie encore pour tout effacer';return}S=fresh();save();location.reload()}

render();
if(S.started&&!S.calls[1]&&!S.ending)setTimeout(()=>incoming(1),1200);
</script>
