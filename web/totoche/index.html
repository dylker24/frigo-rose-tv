<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Inspecteur Totoche</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inspecteur Totoche">
<meta name="theme-color" content="#0b0b0f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Special+Elite&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#f2f2f7;font-family:Inter,system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;background:#0b0b0f;overflow:hidden}
@media (min-width:600px){
  .dock{margin-left:auto;margin-right:auto;width:420px}
  .pgrid{grid-template-columns:repeat(4,1fr)}
  .b{max-width:62%}
  .pv .img{max-width:520px;margin:0 auto}
  .menu,.intro,.end{padding-left:max(28px,calc(50% - 300px));padding-right:max(28px,calc(50% - 300px))}
  .enq .scroll>*{max-width:640px;margin-left:auto;margin-right:auto}
  .card{margin:14px auto}
  .lnotifs{max-width:460px}
}
.status{position:absolute;top:0;left:0;right:0;height:38px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:14px;font-weight:600;z-index:20;pointer-events:none}
.status .bat{display:flex;gap:6px;align-items:center;font-size:12px}
.batt{width:24px;height:11px;border:1.5px solid #fff9;border-radius:3px;position:relative}
.batt i{position:absolute;left:1px;top:1px;bottom:1px;width:5px;background:#ff453a;border-radius:1px}
#screen{position:absolute;inset:0;overflow:hidden}
.page{position:absolute;inset:0;padding-top:38px;display:flex;flex-direction:column;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:30px}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #ffffff12;background:#0b0b0fcc;backdrop-filter:blur(10px)}
.hdr h2{font-size:17px;font-weight:700;flex:1;text-align:center;margin-right:44px}
.back{color:#e8a33d;font-size:16px;background:none;border:0;padding:6px 4px;min-width:44px;text-align:left;cursor:pointer;font-family:inherit}
.big{font-size:32px;font-weight:800;padding:14px 18px 6px}
button{font-family:inherit}

/* intro */
.intro{background:radial-gradient(ellipse at top,#2a1a10 0%,#0b0b0f 65%);justify-content:center;padding:30px 28px;gap:18px}
.intro .tag{font-family:'Special Elite',monospace;color:#e8a33d;letter-spacing:3px;font-size:13px}
.intro h1{font-size:46px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.intro p{color:#c7c7cc;line-height:1.55;font-size:15.5px}
.intro .file{font-family:'Special Elite',monospace;background:#f3ead8;color:#2b2118;padding:16px;border-radius:4px;transform:rotate(-1deg);font-size:13.5px;line-height:1.6;box-shadow:0 10px 30px #0008}
.cta{background:#e8a33d;color:#1a1208;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;width:100%}
.ghost{background:#ffffff14;color:#fff;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;width:100%}

/* lock */
.lock{align-items:center;padding-top:60px}
.lock .wall{position:absolute;inset:0;z-index:-1;background:linear-gradient(#ab8c6c,#f6c99b 60%);filter:brightness(.7)}
.lock .wall svg{filter:none!important}
.lock .time{font-size:78px;font-weight:300;letter-spacing:-2px;margin-top:10px;text-shadow:0 2px 20px #0008}
.lock .date{font-size:17px;font-weight:500;opacity:.9}
.lnotifs{width:92%;margin-top:22px;display:flex;flex-direction:column;gap:8px}
.ln{background:#1c1c1ecc;backdrop-filter:blur(14px);border-radius:16px;padding:10px 13px;font-size:14px}
.ln b{font-size:13px}.ln span{opacity:.6;font-size:12px;float:right}
.pin{margin-top:auto;margin-bottom:20px;background:#0006;backdrop-filter:blur(18px);padding:18px 20px 8px;border-radius:30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pinbtn{margin-top:auto;margin-bottom:34px;background:#ffffff33;backdrop-filter:blur(12px);border:0;color:#fff;font-size:16px;font-weight:600;padding:14px 28px;border-radius:30px;cursor:pointer}
.dots{display:flex;gap:16px}.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}
.dots i.on{background:#fff}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keys button{height:72px;border-radius:50%;border:0;background:#ffffff26;backdrop-filter:blur(10px);color:#fff;font-size:30px;font-weight:400;cursor:pointer}
.keys button:active{background:#ffffff55}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* home */
.home{background:linear-gradient(160deg,#1d2a3a,#2a1a22 60%,#120e0c)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;padding:30px 18px}
.icon{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative;background:none;border:0;color:#fff}
.icon .ic{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;font-size:30px;box-shadow:0 4px 12px #0005}
.icon small{font-size:11.5px}
.badge{position:absolute;top:-6px;right:8px;background:#ff3b30;border-radius:12px;min-width:21px;height:21px;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.dock{margin:auto 12px 44px;background:#ffffff1f;backdrop-filter:blur(16px);border-radius:28px;padding:14px 8px;display:grid;grid-template-columns:repeat(4,1fr)}
.homehint{margin:0 18px;padding:12px 14px;background:#00000055;border-radius:14px;font-size:13px;color:#ddd;line-height:1.45}

/* lists */
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid #ffffff10;cursor:pointer}
.row:active{background:#ffffff0a}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex-shrink:0;font-weight:700}
.row .m{flex:1;min-width:0}
.row .t{display:flex;justify-content:space-between;font-weight:600;font-size:15.5px}
.row .t span{font-weight:400;font-size:13px;color:#8e8e93}
.row .p{color:#8e8e93;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.unread{width:9px;height:9px;border-radius:50%;background:#e8a33d;flex-shrink:0}

/* chat */
.chat{padding:12px 12px 30px;display:flex;flex-direction:column;gap:5px}
.day{text-align:center;font-size:12px;color:#8e8e93;margin:14px 0 6px;font-weight:600}
.b{max-width:78%;padding:9px 13px;border-radius:19px;font-size:15.5px;line-height:1.38}
.b.in{background:#26262a;align-self:flex-start;border-bottom-left-radius:6px}
.b.out{background:#c9822a;color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.b small{display:block;font-size:11px;opacity:.6;margin-top:3px}
.read{align-self:flex-end;font-size:11px;color:#8e8e93;margin-top:-2px}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pgrid div{aspect-ratio:1;overflow:hidden;cursor:pointer;background:#222}
.pgrid svg,.pv svg{width:100%;height:100%;display:block}
.pv{background:#000}
.pv .img{width:100%;aspect-ratio:1}
.meta{padding:16px 18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:#c7c7cc}
.meta b{color:#fff;font-size:16px}

/* notes */
.note{padding:6px 20px 30px;font-size:16px;line-height:1.6;white-space:pre-wrap}
.note h3{font-size:24px;margin-bottom:8px}
.lockbox{margin:30px 20px;padding:24px;border-radius:18px;background:#1c1c1e;text-align:center;display:flex;flex-direction:column;gap:12px}
input.txt{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff22;background:#0b0b0f;color:#fff;font-size:17px;text-align:center;font-family:inherit;text-transform:uppercase;letter-spacing:2px}
.err{color:#ff6961;font-size:13.5px;min-height:18px}

/* calls */
.seg{display:flex;margin:10px 16px;background:#1c1c1e;border-radius:10px;padding:2px}
.seg button{flex:1;padding:8px;border:0;background:none;color:#fff;border-radius:8px;font-size:14px;font-weight:600}
.seg button.on{background:#3a3a3c}
.miss{color:#ff453a}
.vm{padding:14px 16px;border-bottom:1px solid #ffffff10}
.vm .tr{margin-top:8px;font-size:14.5px;color:#d1d1d6;line-height:1.5;font-style:italic;background:#1c1c1e;padding:12px;border-radius:12px}

/* map */
.map svg{width:100%;display:block}
.tl{padding:6px 18px 30px}
.tli{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #ffffff10}
.tli .n{width:28px;height:28px;border-radius:50%;background:#e8a33d;color:#1a1208;font-weight:800;display:grid;place-items:center;flex-shrink:0;font-size:14px}
.tli .n.red{background:#ff453a;color:#fff}
.tli b{display:block}.tli span{color:#8e8e93;font-size:13.5px}

/* enquete */
.enq{background:#f3ead8;color:#2b2118}
.enq .hdr{background:#e9dcc2;border-color:#0001}
.enq .back{color:#9a4a12}
.enq h2{font-family:'Special Elite',monospace}
.card{margin:14px 16px;background:#fffaf0;border-radius:6px;padding:16px;box-shadow:0 2px 8px #0002;border-left:4px solid #9a4a12}
.card h4{font-family:'Special Elite',monospace;font-size:13px;color:#9a4a12;letter-spacing:1px;margin-bottom:6px}
.card p{font-weight:600;font-size:16px;margin-bottom:12px;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:7px}
.opts button{text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid #2b211822;background:#fff;font-size:15px;color:#2b2118;cursor:pointer}
.opts button.ok{background:#2e7d4f;color:#fff;border-color:#2e7d4f}
.opts button.no{background:#f6d5d0;border-color:#c0392b55;text-decoration:line-through;opacity:.7}
.solved{font-family:'Special Elite',monospace;color:#2e7d4f;font-size:15px}
.stats{display:flex;justify-content:space-around;margin:12px 16px;font-family:'Special Elite',monospace;font-size:13px}
.enq .cta{background:#9a4a12;color:#fff}
.enq .ghost{background:#2b211812;color:#2b2118}
.hintbox{margin:0 16px 10px;padding:12px 14px;background:#fff3c4;border-radius:8px;font-size:14px;line-height:1.45}

/* menu */
.menu{background:#0b0b0f;padding:50px 22px 30px;overflow-y:auto}
.menu .brand{font-family:'Special Elite',monospace;color:#e8a33d;font-size:12px;letter-spacing:4px}
.menu h1{font-size:44px;font-weight:800;line-height:.95;letter-spacing:-1.5px;margin:10px 0 6px}
.menu h1 span{color:#e8a33d}
.menu .sub{color:#8e8e93;font-size:14.5px;margin-bottom:28px}
.ep{flex-shrink:0;position:relative;border-radius:22px;overflow:hidden;margin-bottom:16px;cursor:pointer;background:#16161b;border:1px solid #ffffff10;text-align:left;width:100%;color:#fff;padding:0;display:block}
.ep .cov{height:150px;position:relative;overflow:hidden}
.ep .cov svg{width:100%;height:100%;display:block}
.ep .cov:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 30%,#16161b)}
.ep .inf{padding:2px 18px 18px}
.ep .num{font-family:'Special Elite',monospace;color:#e8a33d;font-size:12px;letter-spacing:2px}
.ep h3{font-size:24px;font-weight:800;margin:4px 0}
.ep p{color:#a1a1a6;font-size:14px;line-height:1.45}
.ep .st{position:absolute;top:12px;right:12px;z-index:2;background:#000a;backdrop-filter:blur(8px);padding:6px 11px;border-radius:20px;font-size:12.5px;font-weight:700}
.ep.locked{opacity:.45;cursor:default}
.ep.locked .cov{background:repeating-linear-gradient(45deg,#1c1c22 0 14px,#18181d 14px 28px);display:grid;place-items:center;font-size:34px}
.ep.locked .cov:after{display:none}
.tomenu{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:#ffffff26;backdrop-filter:blur(10px);border:0;color:#fff;border-radius:20px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;z-index:5}
.mini{background:none;border:0;color:#8e8e93;font-size:14px;cursor:pointer;align-self:flex-start;padding:4px 0}

/* banner */
#banner{position:absolute;top:8px;left:8px;right:8px;z-index:50;background:#2c2c2eee;backdrop-filter:blur(16px);border-radius:18px;padding:12px 14px;display:flex;gap:11px;transform:translateY(-130%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);cursor:pointer;box-shadow:0 10px 30px #0008}
#banner.show{transform:none}
#banner .av{width:38px;height:38px;font-size:18px}
#banner b{font-size:14px;display:block}#banner div div{font-size:14px;color:#e5e5ea;line-height:1.35}

/* ending */
.end{background:radial-gradient(ellipse at top,#10301f,#0b0b0f 70%);padding:40px 26px;justify-content:center;gap:16px;text-align:center}
.end h1{font-size:38px;font-weight:800;line-height:1.05}
.end p{color:#c7c7cc;line-height:1.55}
.end .stamp{font-family:'Special Elite',monospace;border:3px solid #4cd38a;color:#4cd38a;display:inline-block;padding:6px 14px;transform:rotate(-6deg);font-size:22px;margin:0 auto;letter-spacing:2px}
.typing{display:flex;gap:4px;padding:12px 14px;background:#26262a;border-radius:19px;align-self:flex-start;width:fit-content}
.typing i{width:7px;height:7px;border-radius:50%;background:#8e8e93;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
</style>
</head>

const KEY='totoche-ep1';

// ============ HORLOGE ============
function tick(){
  let m=7;
  if(S.start) m+=Math.floor((Date.now()-S.start)/60000);
  const h=2+Math.floor(m/60);m%=60;
  document.getElementById('clock').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  const bat=Math.max(3,12-(S.start?Math.floor((Date.now()-S.start)/180000):0));
  document.getElementById('battxt').textContent=bat+'%';
}
setInterval(tick,5000);
function fit(){const a=document.getElementById('app'),W=innerWidth,H=innerHeight;
  if(W<600){a.style.cssText='';return}
  const k=W/620;a.style.cssText=`inset:auto;left:0;top:0;max-width:none;margin:0;width:${W/k}px;height:${H/k}px;transform:scale(${k});transform-origin:0 0`}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));fit();


// ============ NOTIFS ============
let bt;
function notify(who,text,delay=0){
  setTimeout(()=>{
    S.roux.push({t:text,h:document.getElementById('clock').textContent});save();
    const b=document.getElementById('banner');const c=C[who];
    b.innerHTML=`<div class="av" style="background:${c.col}">${c.av}</div><div><b>${c.name}</b><div>${text}</div></div>`;
    b.classList.add('show');clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('show'),6000);
    b.onclick=()=>{b.classList.remove('show');if(S.unlocked){nav=[{v:'thread',id:'roux'}];render()}};
    if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  },delay);
}

const $=s=>document.getElementById(s);
function go(v){nav.push(v);render()}
function back(){nav.pop();render()}
function hdr(title){return `<div class="hdr"><button class="back" onclick="back()">‹ Retour</button><h2>${title}</h2></div>`}

function render(){
  tick();
  const sc=$('screen');
  document.querySelector('.status').style.display=view==='menu'?'none':'flex';
  if(view==='menu'){sc.innerHTML=menu();return}
  if(S.done){sc.innerHTML=ending();return}
  if(S.stage==='intro'){sc.innerHTML=intro();return}
  if(!S.unlocked){sc.innerHTML=lock();return}
  const v=nav[nav.length-1];
  if(!v){sc.innerHTML=home();return}
  const f={messages,thread,photos,photo,notes,note,calls,maps,enquete}[v.v];
  sc.innerHTML=f(v);
  const sc2=sc.querySelector('.scroll');
  if(v.v==='thread'&&sc2)sc2.scrollTop=sc2.scrollHeight;
}

function key(k){
  if(k==='⌫'){pin=pin.slice(0,-1)}else if(pin.length<4)pin+=k;

    if(pin==='1403'){S.unlocked=true;S.stage='phone';save();pin='';render();

    tries++;render();setTimeout(()=>{const d=$('dots');if(d)d.classList.add('shake')},10);
    setTimeout(()=>{pin='';render()},450);
    if(tries===3)notify('roux','Regarde le fond d’écran… y’a un gâteau, non ? 🎂',600);
    return}
  render();
}

  return `<div class="page">${hdr('Téléphone')}<div class="seg"><button class="${S.calls==='recent'?'on':''}" onclick="S.calls='recent';render()">Récents</button><button class="${S.calls==='vm'?'on':''}" onclick="S.calls='vm';render()">Messagerie</button></div><div class="scroll">
  ${S.calls==='recent'?r.map(x=>`<div class="row"><div class="m"><div class="t"><span style="color:inherit;font-size:15.5px;font-weight:600" class="${x[2]?'miss':''}">${x[0]}</span></div><div class="p">${x[1]}</div></div></div>`).join('')
  :vm.map(x=>`<div class="vm"><div class="t" style="display:flex;justify-content:space-between"><b>${x[0]}</b><span style="color:#8e8e93;font-size:13px">${x[1]}</span></div><div class="tr">${x[2]}</div></div>`).join('')}
  </div></div>`}

function maps(){return `<div class="page">${hdr('Plans')}<div class="scroll"><div class="map">
<svg viewBox="0 0 360 300"><rect width="360" height="300" fill="#1b2a22"/>
<path d="M0 250 q90 -20 160 10 q90 30 200 -20" stroke="#2f5d7a" stroke-width="14" fill="none" opacity=".8"/><text x="250" y="262" fill="#6fa3c4" font-size="10" font-family="Inter" font-style="italic">la Vézère</text>
<path d="M70 60 L120 120 L170 170 L250 225" stroke="#4a4a40" stroke-width="6" fill="none"/>
<path d="M120 120 L60 200" stroke="#4a4a40" stroke-width="4" fill="none"/><text x="160" y="150" fill="#aaa" font-size="10" font-family="Inter">D32</text>
<path d="M70 60 L40 30 M250 225 L320 200" stroke="#4a4a40" stroke-width="4" fill="none"/>
<path d="M70 60 Q130 40 210 80 L170 170" stroke="#e8a33d" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>

<circle cx="250" cy="225" r="11" fill="#e8a33d"/><text x="250" y="229" text-anchor="middle" font-weight="800" font-size="12" fill="#1a1208" font-family="Inter">2</text><text x="266" y="222" fill="#fff" font-size="11" font-family="Inter" font-weight="600">Le Bugue</text>
<circle cx="210" cy="80" r="11" fill="#e8a33d"/><text x="210" y="84" text-anchor="middle" font-weight="800" font-size="12" fill="#1a1208" font-family="Inter">3</text><text x="226" y="76" fill="#fff" font-size="11" font-family="Inter" font-weight="600">Les Combes</text>
<circle cx="140" cy="140" r="11" fill="#ff453a"/><text x="140" y="144" text-anchor="middle" font-weight="800" font-size="12" fill="#fff" font-family="Inter">4</text><text x="98" y="165" fill="#ff8a80" font-size="10" font-family="Inter">dernier signal</text>
</svg></div>
<div class="tl"><div style="font-weight:700;font-size:18px;margin:8px 0">Historique · Samedi</div>
<div class="tli"><div class="n">1</div><div><b>Domicile · Rouffignac</b><span>jusqu’à 22:10</span></div></div>
<div class="tli"><div class="n">2</div><div><b>Immobilier Vézère · Le Bugue</b><span>22:35 – 22:44 · agence fermée</span></div></div>

</div></div></div>`}

function enquete(){
  const allOk=QUESTIONS.every(q=>S.ans[q.id]);
  const shown=Math.min(S.hints,HINTS.length);
  return `<div class="page enq">${hdr('Carnet d’enquête')}<div class="scroll">
  <div class="stats"><span>✓ ${Object.keys(S.ans).length}/3</span><span>✗ ${S.errors} erreur${S.errors>1?'s':''}</span><span>💡 ${S.hints} indice${S.hints>1?'s':''}</span></div>
  ${QUESTIONS.map((q,qi)=>`<div class="card"><h4>QUESTION ${qi+1}</h4><p>${q.t}</p>
    ${S.ans[q.id]?`<div class="solved">✓ ${q.o[q.a]}<br><span style="color:#2b2118;font-family:Inter;font-size:14px;line-height:1.45;display:block;margin-top:6px">${q.ok}</span></div>`
    :`<div class="opts">${q.o.map((o,i)=>`<button class="${(S.wrong[q.id]||[]).includes(i)?'no':''}" onclick="answer('${q.id}',${i})">${o}</button>`).join('')}</div>`}
  </div>`).join('')}
  ${HINTS.slice(0,shown).map((h,i)=>`<div class="hintbox">💡 ${h}</div>`).join('')}
  <div style="padding:6px 16px;display:flex;flex-direction:column;gap:10px">
  ${allOk?`<button class="cta" onclick="finale()">🚓 Envoyer les gendarmes</button>`:''}
  ${!allOk&&shown<HINTS.length?`<button class="ghost" onclick="S.hints++;save();render()">💡 Demander un indice</button>`:''}
  <button class="ghost" onclick="resetGame()" style="opacity:.6;font-size:13px">Recommencer depuis le début</button></div>
  </div></div>`}
function answer(id,i){
  const q=QUESTIONS.find(x=>x.id===id);
  if(i===q.a){S.ans[id]=1;save();render();
    const n=Object.keys(S.ans).length;
    if(n===3)notify('roux','Ok. Je te crois. On fonce. Appuie sur « Envoyer les gendarmes » 🚓',700);
    else notify('roux',['Bien vu. Continue.','Ça se tient. Il en reste.'][n-1],700);}
  else{S.errors++;(S.wrong[id]=S.wrong[id]||[]).push(i);save();render();
    if(S.errors===2)notify('roux','Hmm, t’es sûre ? Relis bien les messages avant de foncer.',500)}
}
function resetGame(){
  const b=document.querySelector('.enq .ghost:last-child');
  if(b&&b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Sûr ? Appuie encore pour tout effacer';return}
  S=fresh();nav=[];tries=0;save();render()}

// ============ FINALE ============
function finale(){
  nav=[];const sc=$('screen');
  sc.innerHTML=`<div class="page">${`<div class="hdr"><h2 style="margin:0">${C.roux.name}</h2></div>`}<div class="scroll"><div class="chat" id="fin"></div></div></div>`;
  const msgs=['On est aux Combes. Le séchoir est fermé avec un cadenas neuf.','On force la porte…','…','ELLE EST LÀ.','Vivante. Attachée, déshydratée, mais vivante. Elle demande sa mère et sa chienne 🥲','Serge Lafon vient d’être interpellé à l’agence. La SCI de son frère aussi est perquisitionnée.','Sans toi on l’aurait jamais trouvée à temps. Merci.'];
  let i=0;const box=$('fin');
  function next(){
    if(i>=msgs.length){setTimeout(()=>{S.done=true;S.end=Date.now();save();render()},2200);return}
    box.insertAdjacentHTML('beforeend','<div class="typing" id="ty"><i></i><i></i><i></i></div>');
    setTimeout(()=>{$('ty').remove();box.insertAdjacentHTML('beforeend',`<div class="b in">${msgs[i]}</div>`);i++;
      const s=document.querySelector('.scroll');s.scrollTop=s.scrollHeight;setTimeout(next,700)},1300+msgs[i].length*12)
  }
  next();
}
function ending(){
  const mins=Math.max(1,Math.round(((S.end||Date.now())-S.start)/60000));
  const stars=S.errors===0&&S.hints===0?'⭐⭐⭐':S.errors<=2&&S.hints<=2?'⭐⭐':'⭐';
  return `<div class="page end">
  <div class="stamp">AFFAIRE RÉSOLUE</div>
  <h1>Chloé est rentrée chez elle.</h1>
  <p>Pépite ne l’a pas lâchée de la soirée. Margaux a pleuré pendant une heure. Et Serge Lafon va devoir s’expliquer devant un juge.</p>
  <div class="file" style="font-family:'Special Elite',monospace;background:#f3ead8;color:#2b2118;padding:16px;border-radius:4px;line-height:1.8;text-align:left">
  Temps d’enquête : ${mins} min<br>Erreurs : ${S.errors}<br>Indices : ${S.hints}<br>Note : ${stars}</div>
  <button class="cta" onclick="S=fresh();nav=[];tries=0;save();render()">Rejouer</button>
  <button class="ghost" onclick="toMenu()">Retour aux épisodes</button>
  </div>`}

function toMenu(){view='menu';nav=[];$('banner').classList.remove('show');render()}
function openEp(){view='ep1';render()}
function menu(){
  const st=S.done?'✓ Résolu':S.stage!=='intro'?'En cours':'Nouveau';
  const lockedEp=(n,t)=>`<div class="ep locked"><div class="cov">🔒</div><div class="inf"><div class="num">ÉPISODE ${n}</div><h3>${t}</h3><p>Bientôt disponible.</p></div></div>`;
  return `<div class="page menu">
  <div class="brand">DOSSIERS CLASSÉS · DORDOGNE</div>
  <h1>Inspecteur<br><span>Totoche</span></h1>

  <div class="inf"><div class="num">ÉPISODE 1</div><h3>Disparue</h3><p>Chloé, 24 ans, s’est volatilisée entre Rouffignac et Le Bugue. Il ne reste que son téléphone.</p></div></button>
  ${lockedEp(2,'???')}${lockedEp(3,'???')}
  </div>`}
render();
</script>
