<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Frigo Rosé Télécommande</title>
<meta name="theme-color" content="#0b0b0e">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Télécommande">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
/* Frigo Rosé Télécommande : piloter une télé de la maison depuis le téléphone (passe par Firebase, comme les profils). */
:root{
  --bg:#0b0b0e;--s1:#141418;--s2:#1c1c22;--s3:#26262e;--line:rgba(255,255,255,.08);--ink:#f5f4f8;--mute:#a4a2ad;--faint:#6e6c78;
  --accent:#ff3d7f;--accent2:#ff7aa6;--accent-soft:rgba(255,61,127,.14);--live:#36d399;
  --ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.glow{position:fixed;inset:-20vh -20vw auto;height:70vh;pointer-events:none;z-index:0;
  background:radial-gradient(50% 60% at 30% 20%,rgba(255,61,127,.2),transparent 70%),radial-gradient(40% 50% at 85% 0%,rgba(110,90,255,.16),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(18px + var(--safe-t)) 16px calc(28px + var(--safe-b))}
header{display:flex;align-items:center;gap:10px}
header .lg{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
header h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em}
header small{display:block;color:var(--mute);font-size:12.5px;font-weight:500;margin-top:-2px}
.tvs{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.tvs::-webkit-scrollbar{display:none}
.tv{flex:none;display:flex;align-items:center;gap:9px;padding:8px 13px 8px 9px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:14px;font-weight:600}
.tv .av{width:26px;height:26px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-size:12px;font-weight:800;overflow:hidden}
.tv .av img{width:100%;height:100%;object-fit:cover}
.tv small{color:var(--mute);font-weight:500}
.tv.on{background:var(--ink);color:#111;border-color:var(--ink)}.tv.on small{color:#555}
.empty{margin-top:28px;padding:26px 20px;border-radius:20px;background:var(--s1);border:1px solid var(--line);text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.now{margin-top:16px;padding:16px;border-radius:20px;background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line)}
.now .k{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.now .k .n{background:var(--accent);color:#fff;border-radius:7px;padding:2px 7px;letter-spacing:0}
.now .k .dot{width:7px;height:7px;border-radius:50%;background:var(--live)}
.now .k .dot.pause{background:var(--faint)}
.now h2{margin:8px 0 2px;font-size:21px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.now .m{color:var(--mute);font-size:13.5px}
.now .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.1);margin-top:12px;overflow:hidden}.now .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.pad{position:relative;width:min(78vw,292px);aspect-ratio:1;margin:26px auto 8px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#24242c,#16161b 70%);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.pad .d{position:absolute;width:34%;height:34%;display:grid;place-items:center;color:var(--ink);border-radius:50%}
.pad .d svg{width:30px;height:30px}
.pad .u{top:0;left:33%}.pad .dn{bottom:0;left:33%}.pad .l{left:0;top:33%}.pad .r{right:0;top:33%}
.pad .ok{position:absolute;inset:30%;border-radius:50%;background:linear-gradient(160deg,var(--accent2),var(--accent));color:#fff;font-weight:900;font-size:19px;letter-spacing:.04em;box-shadow:0 10px 26px rgba(255,61,127,.35)}
.pad button:active{transform:scale(.92)}
.pad .d:active{background:rgba(255,255,255,.06)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.b{display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 4px 11px;border-radius:16px;background:var(--s2);border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--mute)}
.b svg{width:23px;height:23px;color:var(--ink)}
.b:active{transform:scale(.95);background:var(--s3)}
.b.pri{background:var(--accent-soft);border-color:rgba(255,61,127,.35)}.b.pri svg{color:var(--accent2)}
.zap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.zap .b{flex-direction:row;justify-content:center;font-size:14px;color:var(--ink);padding:14px}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:28px 2px 10px;font-weight:700}
.search{width:100%;font:500 16px var(--ui);color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;-webkit-user-select:text;user-select:text}
.search:focus{outline:none;border-color:var(--accent)}
.chs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ch{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);text-align:left}
.ch .num{width:34px;height:34px;flex:none;border-radius:10px;background:var(--s3);display:grid;place-items:center;font-weight:800;font-size:14px}
.ch.cur .num{background:var(--accent);color:#fff}
.ch b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch small{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch div{min-width:0;flex:1}
.ch:active{background:var(--s2)}
.toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#111;font-weight:700;font-size:14px;padding:10px 16px;border-radius:99px;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <header><div class="lg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M8 3l4 3 4-3"/></svg></div><div><h1>Télécommande</h1><small>Frigo Rosé TV</small></div></header>
  <div class="tvs" id="tvs"></div>
  <div class="empty" id="empty"><b>Aucune télé allumée</b>Ouvre Frigo Rosé TV sur une télé : elle apparaît ici toute seule.</div>
  <div id="ctl" hidden>
    <div class="now" id="now"></div>
    <div class="pad">
      <button class="d u" data-k="up" aria-label="Haut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="d dn" data-k="down" aria-label="Bas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="d l" data-k="left" aria-label="Gauche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="d r" data-k="right" aria-label="Droite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="ok" data-k="ok">OK</button>
    </div>
    <div class="row">
      <button class="b" data-k="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>Retour</button>
      <button class="b" data-c="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Accueil</button>
      <button class="b" data-k="playpause" id="pp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>Pause</button>
      <button class="b" data-k="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 10v10"/></svg>Guide</button>
      <button class="b" data-c="restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 108-8"/><path d="M4 4v5h5"/></svg>Au début</button>
      <button class="b" data-c="golive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M7.5 7.5a6.5 6.5 0 000 9M16.5 7.5a6.5 6.5 0 010 9"/></svg>Direct</button>
      <button class="b" data-k="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Infos</button>
      <button class="b pri" data-c="surprise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>Surprise</button>
    </div>
    <div class="zap">
      <button class="b" data-k="chdown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>Chaîne −</button>
      <button class="b" data-k="chup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>Chaîne +</button>
    </div>
    <h3>Les chaînes</h3>
    <input class="search" id="q" placeholder="Chercher une chaîne ou un programme" autocomplete="off">
    <div class="chs" id="chs"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const FBC={apiKey:"AIzaSyC54a8ejVmz8--xvWu3KtZfqPGrabM_-E0",authDomain:"nosrecettes-ede01.firebaseapp.com",databaseURL:"https://nosrecettes-ede01-default-rtdb.europe-west1.firebasedatabase.app",projectId:"nosrecettes-ede01",storageBucket:"nosrecettes-ede01.firebasestorage.app",messagingSenderId:"230506326823",appId:"1:230506326823:web:784e4b36ada74f1a3e1702"};
const AVBASE="../avatars/";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let db=null,TVS={},sel=LS.get("frr_tv",""),toastT=null;
function toast(m){$("toast").textContent=m;$("toast").hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>$("toast").hidden=true,2200)}
function hhmm(t){const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function buzz(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
function send(c,a){
  if(!db||!sel||!TVS[sel])return toast("Choisis une télé");
  buzz();db.ref("frigorosetv/rcmd/"+sel).set({c,a:a==null?null:a,at:Date.now(),id:Math.random().toString(36).slice(2,10)}).catch(()=>toast("Pas de connexion"));
}
function live(){const now=Date.now();return Object.entries(TVS).filter(([,v])=>v&&now-(v.at||0)<90000).sort((a,b)=>(b[1].at||0)-(a[1].at||0))}
function render(){
  const tv=live();
  if(!tv.find(([id])=>id===sel))sel=tv.length?tv[0][0]:"";
  const box=$("tvs");box.innerHTML=tv.map(([id,v])=>{
    const av=v.pic?'<img src="'+esc(AVBASE+v.pic)+'" alt="">':esc((v.profile||"?").charAt(0).toUpperCase());
    return '<button class="tv'+(id===sel?" on":"")+'" data-id="'+esc(id)+'"><span class="av">'+av+'</span>'+esc(v.device||"Télé")+(v.profile?' <small>· '+esc(v.profile)+'</small>':'')+'</button>'}).join("");
  box.querySelectorAll(".tv").forEach(b=>b.onclick=()=>{sel=b.dataset.id;LS.set("frr_tv",sel);buzz();send("hello");render()});
  $("empty").hidden=!!tv.length;$("ctl").hidden=!tv.length;
  const v=sel&&TVS[sel];if(!v)return;
  const now=Date.now(),pct=v.start&&v.stop?Math.max(0,Math.min(100,(now-v.start)/(v.stop-v.start)*100)):0;
  const where=v.screen==="live"?"":({home:"Accueil",guide:"Guide",chaines:"Chaînes",search:"Recherche",settings:"Réglages",demandes:"Demandes",profiles:"Choix du profil"}[v.screen]||"");
  $("now").innerHTML='<div class="k">'+(v.num?'<span class="n">'+esc(v.num)+'</span>':'')+esc(v.channel||"")+' · <span class="dot'+(v.paused?" pause":"")+'"></span>'+(v.so?"Depuis le début":v.paused?"En pause":"En direct")+'</div>'+
    '<h2>'+esc(v.title||v.channel||"Frigo Rosé TV")+'</h2><div class="m">'+(v.start&&v.title?hhmm(v.start)+" – "+hhmm(v.stop):"")+(where?(v.title?" · ":"")+"À l'écran : "+where:"")+'</div>'+(pct?'<div class="bar"><i style="width:'+pct+'%"></i></div>':'');
  $("pp").lastChild.textContent=v.paused?"Lecture":"Pause";
  renderChs();
}
function renderChs(){
  const v=sel&&TVS[sel];const box=$("chs");if(!v||!v.list){box.innerHTML="";return}
  const q=$("q").value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const m=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").includes(q);
  box.innerHTML=v.list.filter(c=>!q||m(c.n)||m(c.t)||String(c.num)===q).map(c=>'<button class="ch'+(c.num==v.num?" cur":"")+'" data-n="'+esc(c.num)+'"><span class="num">'+esc(c.num)+'</span><div><b>'+esc(c.n)+'</b><small>'+esc(c.t||"Programmation continue")+'</small></div></button>').join("");
  box.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{send("tune",+b.dataset.n);toast("Chaîne "+b.dataset.n)});
}
document.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>send("key",b.dataset.k)));
document.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>send(b.dataset.c)));
$("q").addEventListener("input",renderChs);
try{firebase.initializeApp(FBC);db=firebase.database();db.ref("frigorosetv/remotes").on("value",s=>{TVS=s.val()||{};render()})}catch(e){$("empty").innerHTML="<b>Connexion impossible</b>Vérifie internet et réessaie."}
setInterval(render,20000);
</script>
</body>
</html>
