<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14122a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Cahier de culture</title>
<meta name="version" content="8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: une nuit de grotte, des dates gravées en très grand ; chaque domaine a sa couleur (ocre = histoire, lagon = géo, mousse = animaux) */
:root{
  /* 7 couleurs à la même luminosité et la même intensité : seules les teintes changent, elles s'accordent toutes */
  --bg:oklch(18% .035 275);
  --surface:oklch(23% .04 275);
  --surface-2:oklch(27% .045 275);
  --line:oklch(35% .05 275);
  --text:oklch(97% .01 275);
  --muted:oklch(77% .035 275);
  --ochre:oklch(80% .13 50);
  --pink:oklch(76% .15 355);
  --violet:oklch(75% .14 295);
  --lagoon:oklch(80% .11 235);
  --teal:oklch(81% .11 185);
  --moss:oklch(84% .13 140);
  --ember:oklch(87% .13 92);
  --good:oklch(84% .14 155);
  --bad:oklch(70% .17 20);
  --ink:oklch(20% .04 275);
  --display:"Outfit", "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-variant-numeric:lining-nums;
  background:var(--bg);
  background-image:
    radial-gradient(900px 520px at 90% -10%, color-mix(in oklab, var(--violet) 22%, transparent), transparent 60%),
    radial-gradient(800px 480px at -10% 30%, color-mix(in oklab, var(--lagoon) 12%, transparent), transparent 60%),
    radial-gradient(900px 600px at 60% 120%, color-mix(in oklab, var(--pink) 14%, transparent), transparent 60%);
  background-attachment:fixed;
  color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:10px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.02em}
em{font-style:normal}
.head h1{font-weight:800;letter-spacing:-.035em}
img{max-width:100%;display:block}

/* ---------- Header + nav ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px max(16px,4vw);
  background:linear-gradient(var(--bg) 60%, transparent);}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--text)}
.brand b{font-family:var(--display);font-size:22px;font-style:normal;font-weight:700}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.brand{white-space:nowrap}
@media (max-width:1400px){.brand span{display:none}}
@media (max-width:1160px){.sync span{display:none}}
.tabs a{white-space:nowrap;position:relative;padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;transition:color .25s}
.tabs a[aria-current="page"]{color:var(--bg)}
.tabs a .short{display:none}
@media (max-width:820px){.tabs a .short{display:inline}}
.tabs a .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:middle;background:var(--c,var(--muted))}
.tabs a[aria-current="page"] .dot{background:var(--bg)}
.pill{position:absolute;inset:4px auto 4px 0;border-radius:999px;background:var(--ochre);transition:transform .45s cubic-bezier(.6,.05,.2,1),width .45s cubic-bezier(.6,.05,.2,1),background .45s;z-index:-1}
.tabs{position:relative;isolation:isolate}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] i{background:var(--good);box-shadow:0 0 0 4px color-mix(in oklab, var(--good) 20%, transparent)}
.sync[data-s="busy"] i{background:var(--ochre);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

main{max-width:1180px;margin:0 auto;padding:8px max(16px,4vw) 120px}

@media (max-width:820px){
  .tabs{position:fixed;left:12px;right:12px;bottom:12px;margin:0;justify-content:space-between;z-index:30;
    background:color-mix(in oklab, var(--surface) 92%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:5px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .tabs a{padding:9px 1px;font-size:10.5px;flex:1 1 0;min-width:0;text-align:center;letter-spacing:-.01em}
  .tabs a .dot{display:block;margin:0 auto 3px}
  .tabs a .long{display:none}
  .sync{margin-left:auto}
}
@media (max-width:520px){.brand span{display:none}.brand b{font-size:20px}}
@media (max-width:820px){.tabs a[data-r="accueil"],.tabs a[data-r="anecdotes"]{display:none}}
@media (max-width:1320px) and (min-width:821px){.tabs a{padding:8px 10px}.tabs a .dot{display:none}}

/* ---------- Entrées animées ---------- */
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:.001;transform:translateY(18px)}to{opacity:1;transform:none}}

.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--c,var(--ochre));font-weight:700}
.head{display:grid;gap:10px;padding:28px 0 26px}
.head h1{font-size:clamp(44px,8vw,92px);line-height:.95}
.head h1 em{font-style:normal;color:var(--c,var(--ochre))}
.head p{max-width:60ch;color:var(--muted);margin:0;font-size:17px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:44px 0 16px}
.sec-title h2{font-size:clamp(26px,3.6vw,38px)}
.sec-title small{color:var(--muted);font-size:14px}

/* ---------- Accueil ---------- */
.hero{position:relative;padding:36px 0 30px;display:grid;gap:8px;min-height:340px;align-content:center}
.hero .eyebrow{display:flex;gap:10px;align-items:center}
.hero .eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.roller{font-family:var(--body);font-weight:700;font-size:clamp(96px,22vw,250px);line-height:.86;letter-spacing:-.03em;
  height:1em;overflow:hidden;display:flex;color:var(--text)}
.roller .ch{display:inline-block;animation:chIn .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k) * 60ms)}
.roller.out .ch{animation:chOut .45s cubic-bezier(.6,0,.8,.2) both;animation-delay:calc(var(--k) * 35ms)}
@keyframes chIn{from{transform:translateY(105%) rotate(6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes chOut{to{transform:translateY(-105%) rotate(-4deg);opacity:0}}
.roller-cap{font-family:var(--display);font-style:normal;font-size:clamp(22px,3vw,34px);min-height:1.4em;color:var(--text)}
.roller-cap span{display:inline-block;animation:capIn .8s .25s cubic-bezier(.2,.8,.2,1) both}
@keyframes capIn{from{opacity:0;transform:translateX(-14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.hero-bar{display:flex;gap:6px;margin-top:18px}
.hero-bar i{height:3px;flex:1;max-width:46px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.hero-bar i.on::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ochre),var(--pink));transform-origin:left;animation:fill 4.2s linear both}
.hero-bar i.done{background:var(--pink)}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
@media (max-width:460px){.tiles{grid-template-columns:1fr 1fr}.tile{min-height:160px;padding:18px}.tile .big{font-size:44px}.tile h3{font-size:20px}}
.tile{position:relative;display:grid;gap:10px;padding:22px;border-radius:var(--r);background:var(--c);border:0;text-decoration:none;color:var(--ink);box-shadow:0 18px 40px -22px var(--c);overflow:hidden;min-height:190px;align-content:space-between;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .35s}
.tile::before{content:"";position:absolute;inset:-1px;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%), rgba(255,255,255,.35), transparent 55%);opacity:0;transition:opacity .35s}
.tile:hover{transform:translateY(-6px) rotate(-1deg)}
.tile:hover::before{opacity:1}
.tile > *{position:relative}
.tile .big{font-family:var(--body);font-weight:700;font-size:64px;line-height:1;font-style:normal;color:var(--ink)}
.tile h3{font-size:26px}
.tile p{margin:0;color:color-mix(in oklab, var(--ink) 75%, transparent);font-size:14px;font-weight:500}
.meter{height:6px;border-radius:6px;background:color-mix(in oklab, var(--ink) 18%, transparent);overflow:hidden}
.meter b{display:block;height:100%;background:var(--ink);border-radius:4px;transform-origin:left;animation:grow 1.1s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}

.fact{margin-top:14px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:22px 24px;border-radius:var(--r);background:linear-gradient(100deg,color-mix(in srgb,var(--c,var(--pink)) 26%, var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--c,var(--pink)) 40%, var(--line))}
.fact .q{font-family:var(--display);font-size:64px;line-height:.6;color:var(--c,var(--pink));font-style:normal;padding-top:18px}
.fact p{margin:0;font-size:18px}
.fact p span{display:inline-block;animation:capIn .6s cubic-bezier(.2,.8,.2,1) both}
@media (max-width:560px){.fact{grid-template-columns:1fr}.fact .q{display:none}}

/* ---------- Boutons, chips ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;transition:transform .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-1px);border-color:var(--muted)}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--c,var(--pink));color:var(--ink);border-color:transparent}
.btn.on{background:color-mix(in srgb,var(--good) 18%, var(--surface));border-color:var(--good);color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:600;color:var(--muted);transition:all .25s}
.chip[aria-pressed="true"]{background:var(--c,var(--pink));color:var(--ink);border-color:transparent}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 16%, transparent);color:var(--c)}

/* ---------- Frise ---------- */
.frise{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.seg{position:relative;text-align:left;border:1px solid color-mix(in srgb,var(--c) 45%, var(--line));background:color-mix(in srgb,var(--c) 12%, var(--surface));border-radius:14px;padding:16px 14px 18px;min-height:112px;display:grid;align-content:space-between;gap:10px;overflow:hidden;
  transform-origin:left;animation:segIn .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 90ms);transition:border-color .3s,background .3s,transform .3s}
@keyframes segIn{from{transform:scaleX(.2);opacity:0}to{transform:none;opacity:1}}
.seg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.seg:hover{transform:translateY(-2px)}
.seg[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--ink);box-shadow:0 16px 36px -18px var(--c)}
.seg[aria-pressed="true"] small,.seg[aria-pressed="true"] .n{color:var(--ink)}
.seg[aria-pressed="true"]::after{transform:none}
.seg b{font-family:var(--display);font-size:clamp(17px,2vw,24px);line-height:1.05}
.seg small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg .n{font-family:var(--body);font-weight:700;font-style:normal;color:var(--c);font-size:15px}
.cuts{position:relative;height:34px;margin-top:6px;font-size:12px;color:var(--muted)}
.cuts span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;text-align:center}
.cuts span::before{content:"";display:block;width:1px;height:10px;background:var(--muted);opacity:.6;margin:0 auto 4px}
@media (max-width:720px){
  .frise{grid-template-columns:1fr;gap:8px}.seg{min-height:0;grid-template-columns:auto 1fr auto;align-items:center}
  .cuts{display:none}
}

.chapter{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-top:22px}
@media (max-width:900px){.chapter{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.chapter .panel{animation:panelIn .6s cubic-bezier(.2,.8,.2,1) both}
.chapter .panel:nth-child(2){animation-delay:.08s}
@keyframes panelIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.chapter h2{font-size:clamp(34px,5vw,58px);line-height:1}
.chapter .range{font-family:var(--display);font-style:normal;color:var(--c);font-size:20px;margin:6px 0 14px}
.chapter .intro{font-size:18px;margin:0 0 18px;max-width:60ch}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.pts li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.pts li::before{content:"";width:7px;height:7px;border-radius:50%;margin-top:9px;background:var(--c,var(--ochre))}
.pts strong{color:var(--text)}
.pts li{color:color-mix(in oklab, var(--text) 88%, var(--muted))}
.dates{list-style:none;margin:18px 0 0;padding:0;position:relative}
.dates::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.dates li{position:relative;display:grid;grid-template-columns:88px 1fr;gap:12px;padding:8px 0 8px 24px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 70ms + .15s)}
.dates li::before{content:"";position:absolute;left:0;top:15px;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%, transparent)}
.dates b{font-family:var(--body);font-weight:700;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.dates span{color:color-mix(in oklab, var(--text) 88%, var(--muted));font-size:15px}
.people-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}

/* ---------- Image slot ---------- */
.slot{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:var(--surface-2);border:1px dashed var(--line);display:grid;place-items:center;text-align:center}
.slot img{width:100%;height:100%;object-fit:cover}
.slot .add{display:grid;gap:6px;justify-items:center;color:var(--muted);font-size:13px;padding:16px;background:none;border:0}
.slot .add svg{opacity:.8}
.slot .add:hover{color:var(--text)}
.slot.has{border-style:solid}
.slot .swap{position:absolute;right:10px;bottom:10px;padding:7px 12px;border-radius:999px;border:0;background:color-mix(in oklab, var(--bg) 80%, transparent);backdrop-filter:blur(8px);font-size:12px;font-weight:600;opacity:0;transition:opacity .25s}
.slot:hover .swap,.slot:focus-within .swap{opacity:1}
@media (hover:none){.slot .swap{opacity:1}}

/* ---------- Cartes fiches ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;overflow:hidden;display:grid;grid-template-rows:auto 1fr;
  transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .4s}
.card:hover{transform:translateY(-6px) rotate(-.4deg);border-color:color-mix(in srgb,var(--c) 55%, var(--line));box-shadow:0 22px 50px -20px color-mix(in srgb,var(--c) 45%, transparent)}
.card .cover{aspect-ratio:5/4;position:relative;overflow:hidden;background:var(--surface-2)}
.card .cover img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.card:hover .cover img{transform:scale(1.06)}
.ph{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.10) 0 2px, transparent 2px 14px),
    radial-gradient(circle at 25% 15%, rgba(255,255,255,.35), transparent 55%),
    linear-gradient(150deg, var(--c), var(--c2,var(--violet)))}
.ph .ini{font-family:var(--display);font-style:normal;font-weight:700;font-size:120px;line-height:1;color:var(--ink);opacity:.85;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.card:hover .ph .ini{transform:scale(1.08) rotate(-4deg)}
.ph .hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--ink);font-weight:600;display:flex;gap:6px;align-items:center}
.card-body{padding:16px 18px 20px;display:grid;gap:6px;align-content:start}
.card .meta{font-size:12px;color:var(--c);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.card h3{font-size:24px;line-height:1.1}
.card p{margin:0;font-size:14px;color:var(--muted)}
.badge{position:absolute;top:12px;right:12px;padding:5px 10px 5px 8px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in oklab, var(--bg) 82%, transparent);backdrop-filter:blur(8px);color:var(--good);display:flex;gap:5px;align-items:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:10px}.card h3{font-size:19px}.card p{display:none}.card-body{padding:12px 12px 14px}.ph .ini{font-size:78px}.ph .hint{display:none}.card.new{min-height:200px}}
.card.new{border-style:dashed;display:grid;place-items:center;min-height:300px;color:var(--muted);gap:10px;align-content:center;justify-items:center}
.card.new:hover{color:var(--text)}
.card.new .plus{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:28px;transition:transform .4s}
.card.new:hover .plus{transform:rotate(90deg);border-color:var(--c)}

/* ---------- Records ---------- */
.records{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
@media (max-width:560px){.records{grid-template-columns:1fr 1fr;gap:10px}.rec{padding:16px}.rec b{font-size:24px!important}.rec span{font-size:13px}}
.rec{padding:20px 22px;border-radius:var(--r);background:color-mix(in srgb,var(--c) 13%, var(--surface));border:1px solid color-mix(in srgb,var(--c) 38%, var(--line));display:grid;gap:4px}
.rec small{color:var(--muted);font-size:13px}
.rec b{font-family:var(--body);font-weight:700;font-size:34px;line-height:1.05;color:var(--c)}
.rec span{font-size:14px;color:color-mix(in oklab, var(--text) 88%, var(--muted))}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
.cloud{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cloud span{padding:8px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:14px}
.cloud span em{font-style:normal;color:var(--muted);font-weight:400;margin-left:6px;font-size:13px}

/* ---------- Flip cartes pays ---------- */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:16px}
.flip{display:block;perspective:900px;-webkit-perspective:900px;height:132px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip:focus-visible{outline:2px solid var(--lagoon);outline-offset:3px;border-radius:16px}
.flip .in{position:relative;display:block;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:16px;padding:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;align-content:space-between;border:1px solid var(--line)}
.flip .f{background:var(--surface)}
.flip .b{background:var(--lagoon);border-color:var(--lagoon);color:var(--ink);transform:rotateY(180deg)}
.flip .b small{color:color-mix(in oklab, var(--ink) 70%, transparent)}
.flip small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flip strong{font-family:var(--display);font-size:24px;line-height:1.05}
.flip .b strong{color:var(--ink)}
.flip .trap{font-size:12px;color:var(--pink);font-weight:700}
.flip .b .trap{color:var(--ink);font-weight:500}

/* ---------- Drapeaux ---------- */
.fimg{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;box-shadow:0 0 0 1px color-mix(in oklab, var(--text) 12%, transparent), 0 10px 24px -12px rgba(0,0,0,.6)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
@media (max-width:460px){.fgrid{grid-template-columns:1fr 1fr;gap:10px}}
.fcard{perspective:900px;-webkit-perspective:900px;height:236px;cursor:pointer;-webkit-tap-highlight-color:transparent}
@media (max-width:460px){.fcard{height:260px}}
.fcard .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.fcard.on .in{transform:rotateY(180deg)}
.fcard .f,.fcard .b{position:absolute;inset:0;border-radius:16px;padding:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);background:var(--surface);display:grid;align-content:space-between;gap:8px}
.fcard .f{place-content:center}
.fcard .f .fimg{width:132px}
.fcard .b .tip{margin:0;font-size:12.5px;line-height:1.4;color:color-mix(in oklab, var(--ink) 85%, transparent);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.tipline{margin:0 0 4px;font-size:15px}
.tipline b{color:var(--teal)}
.fcard .b{transform:rotateY(180deg);background:var(--teal);border-color:var(--teal);color:var(--ink)}
.fcard .b strong{font-family:var(--display);font-size:21px;line-height:1.05}
.fcard .b small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:color-mix(in oklab, var(--ink) 70%, transparent)}
.fcard .b button{justify-self:start;border:0;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;background:color-mix(in oklab, var(--ink) 14%, transparent);color:var(--ink)}
.fcard .b button[aria-pressed="true"]{background:var(--ink);color:var(--teal)}
.fcard .tick{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:var(--ink);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.fcard:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:16px}
.modes{display:flex;gap:8px;margin:0 0 6px;flex-wrap:wrap}
.fq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:760px){.fq{grid-template-columns:1fr;gap:18px}}
.fq .big{width:100%;max-width:440px;justify-self:center;animation:flagIn .6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes flagIn{from{opacity:0;transform:perspective(700px) rotateY(-35deg) scale(.85)}to{opacity:1;transform:none}}
.streak{display:flex;gap:18px;align-items:baseline;margin-bottom:18px}
.streak b{font-family:var(--body);font-weight:700;font-size:56px;line-height:1;color:var(--teal);font-variant-numeric:tabular-nums}
.streak b.bump{animation:okPop .45s cubic-bezier(.3,1.6,.5,1)}
.streak span{color:var(--muted);font-size:14px}
.twins{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.twin{padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:12px}
.twin .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.twin figure{margin:0;display:grid;gap:6px;font-weight:700;font-size:14px}
.twin p{margin:0;color:var(--muted);font-size:14px}
.fbar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:6px;max-width:420px}
.fbar b{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--lagoon));border-radius:8px;transform-origin:left;animation:grow 1.1s .2s cubic-bezier(.2,.8,.2,1) both}

/* ---------- À regarder ---------- */
.hero-w{position:relative;border-radius:24px;overflow:hidden;min-height:340px;display:grid;align-content:end;padding:32px;margin-top:10px;isolation:isolate}
.hero-w .bgw{position:absolute;inset:0;z-index:-2;background-size:200% 200%;animation:pan 18s ease-in-out infinite alternate}
.hero-w .bgw img{width:100%;height:100%;object-fit:cover}
.hero-w::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg, color-mix(in oklab, var(--bg) 92%, transparent) 0%, color-mix(in oklab, var(--bg) 40%, transparent) 55%, transparent 100%)}
@keyframes pan{from{background-position:0% 30%}to{background-position:100% 70%}}
.hero-w h2{font-size:clamp(34px,6vw,64px);line-height:.98;font-weight:800;letter-spacing:-.03em;max-width:16ch;animation:panelIn .8s cubic-bezier(.2,.8,.2,1) both}
.hero-w p{max-width:52ch;margin:10px 0 18px;color:color-mix(in oklab, var(--text) 85%, var(--muted));animation:panelIn .8s .1s cubic-bezier(.2,.8,.2,1) both}
.hero-w .actions{animation:panelIn .8s .2s cubic-bezier(.2,.8,.2,1) both}
.hero-w .meta{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text);opacity:.85}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 4px}
.row-h h2{font-size:clamp(22px,3vw,30px)}
.row-h .arrows{display:flex;gap:6px}
.row-h .arrows button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:16px}
@media (hover:none){.row-h .arrows{display:none}}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(150px,17vw,200px);gap:14px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:14px 4px 22px;margin:0 -4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.poster{position:relative;scroll-snap-align:start;aspect-ratio:2/3;border-radius:16px;overflow:hidden;border:0;padding:0;text-align:left;color:var(--text);
  background:linear-gradient(160deg,var(--p1),var(--p2));box-shadow:0 14px 30px -18px rgba(0,0,0,.7);
  transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 50ms)}
.poster:hover,.poster:focus-visible{transform:translateY(-6px) scale(1.04);box-shadow:0 26px 50px -18px var(--p1);z-index:2}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .motif{position:absolute;right:var(--mx,-18%);top:var(--my,6%);width:95%;opacity:.2;color:var(--ink);transform:rotate(var(--rot,0deg));transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.poster:hover .motif{transform:rotate(calc(var(--rot,0deg) + 8deg)) scale(1.08)}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg, color-mix(in oklab, var(--bg) 88%, transparent) 0%, transparent 58%)}
.poster .badge2{position:absolute;top:10px;left:10px;z-index:1;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;background:color-mix(in oklab, var(--bg) 70%, transparent);backdrop-filter:blur(6px)}
.poster .seen{position:absolute;top:10px;right:10px;z-index:1;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:var(--ink)}
.poster .pt{position:absolute;left:12px;right:12px;bottom:12px;z-index:1;display:grid;gap:4px}
.poster .pt b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.poster .pt small{font-size:12px;color:color-mix(in oklab, var(--text) 75%, transparent)}
.poster.add{background:var(--surface);border:1px dashed var(--line);display:grid;place-items:center;align-content:center;gap:10px;color:var(--muted)}
.poster.add::after{display:none}
.poster.add .plus{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:26px;transition:transform .4s}
.poster.add:hover .plus{transform:rotate(90deg)}
.wsheet-cover{position:relative;aspect-ratio:16/8;background:linear-gradient(160deg,var(--p1),var(--p2));overflow:hidden;border-bottom:1px solid var(--line)}
.wsheet-cover img{width:100%;height:100%;object-fit:cover}
.wsheet-cover .motif{position:absolute;right:-6%;top:-10%;width:60%;opacity:.22;color:var(--ink)}
.wsheet-cover .btn{position:absolute;left:16px;bottom:16px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{padding:6px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:600}

/* ---------- Carte ---------- */
.mapbox{position:relative;margin-top:14px;border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%, color-mix(in oklab, var(--lagoon) 14%, var(--surface)), var(--surface) 75%);border:1px solid var(--line)}
#map{display:block;width:100%;height:auto;aspect-ratio:1000/520;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
@media (max-width:640px){#map{aspect-ratio:16/12}}
#map.drag{cursor:grabbing}
#map path{stroke:var(--bg);stroke-width:.5;vector-effect:non-scaling-stroke;transition:fill .25s}
#map path:not([data-c]){fill:color-mix(in oklab, var(--muted) 18%, var(--surface))}
#map path[data-c],#map circle{fill:color-mix(in oklab, var(--rc) 42%, var(--surface-2));cursor:pointer}
#map path[data-c]:hover,#map circle:hover{fill:color-mix(in oklab, var(--rc) 75%, var(--surface-2))}
#map .sel{fill:var(--rc) !important}
#map .ok{fill:var(--good) !important;animation:blinkOk 1s ease-in-out 2}
#map .ko{fill:var(--bad) !important}
#map .dim{opacity:.35}
#map circle{stroke:var(--bg);stroke-width:.6;vector-effect:non-scaling-stroke}
@keyframes blinkOk{50%{opacity:.4}}
.mapctl{position:absolute;right:12px;top:12px;display:grid;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:color-mix(in oklab, var(--bg) 78%, transparent);backdrop-filter:blur(8px);font-size:18px;font-weight:700}
.mapq{position:absolute;left:12px;top:12px;right:64px;display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:16px;background:color-mix(in oklab, var(--bg) 82%, transparent);backdrop-filter:blur(10px);border:1px solid var(--line);animation:panelIn .5s cubic-bezier(.2,.8,.2,1) both}
.mapq img{width:46px}
.mapq b{font-family:var(--display);font-size:20px;line-height:1.1}
.mapq small{display:block;color:var(--muted);font-size:12px}
.mapq .st{margin-left:auto;text-align:right;font-weight:800;font-size:22px;color:var(--teal);line-height:1}
.mapinfo{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:12px;padding:18px 20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);animation:panelIn .45s cubic-bezier(.2,.8,.2,1) both}
.mapinfo img{width:120px}
.mapinfo h3{font-size:28px}
.mapinfo p{margin:4px 0 0;color:color-mix(in oklab, var(--text) 85%, var(--muted));font-size:15px}
.mapinfo .cap{font-weight:700;color:var(--lagoon)}
@media (max-width:520px){.mapinfo{grid-template-columns:1fr}.mapinfo img{width:96px}}

/* ---------- Anecdotes ---------- */
.deck{position:relative;max-width:640px;margin:10px auto 0;height:min(62vh,460px)}
@media (max-width:820px){.deck{height:min(46vh,380px)}.acard{padding:24px}}
.deck .back{position:absolute;inset:0;border-radius:28px;background:var(--surface);border:1px solid var(--line)}
.deck .back.b1{transform:rotate(-4deg) translateY(10px);opacity:.6}
.deck .back.b2{transform:rotate(3deg) translateY(6px);opacity:.8}
.acard{position:absolute;inset:0;border-radius:28px;padding:30px;display:grid;align-content:space-between;color:var(--ink);
  background:linear-gradient(150deg,var(--ac),color-mix(in oklab, var(--ac) 55%, var(--violet)));box-shadow:0 30px 60px -30px var(--ac);
  touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;animation:cardIn .55s cubic-bezier(.2,.9,.3,1.15) both}
.acard.drag{transition:none;cursor:grabbing}
.acard.fly{transition:transform .4s cubic-bezier(.5,0,.75,0),opacity .4s}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.94) rotate(-2deg)}to{opacity:1;transform:none}}
.acard .kind{justify-self:start;padding:6px 12px;border-radius:999px;background:color-mix(in oklab, var(--ink) 14%, transparent);font-weight:700;font-size:13px}
.acard p{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(24px,4.4vw,34px);line-height:1.18;letter-spacing:-.01em;text-wrap:pretty}
.acard .foot{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;color:color-mix(in oklab, var(--ink) 70%, transparent)}
.acard .q2{font-family:var(--display);font-size:90px;line-height:.5;opacity:.25;font-weight:800}
.dctl{display:flex;justify-content:center;gap:12px;margin-top:22px}
.dctl button{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;display:grid;place-items:center;transition:transform .2s}
.dctl button:active{transform:scale(.9)}
.dctl .fav{width:64px;height:64px;color:var(--pink)}
.dctl .fav[aria-pressed="true"]{background:var(--pink);color:var(--ink);border-color:var(--pink);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.swipehint{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}

/* ---------- Quiz ---------- */
.quiz{max-width:780px;margin:0 auto}
.qbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 30px}
.qbar b{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--ember));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.qnum{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.qq{font-size:clamp(28px,4.4vw,46px);line-height:1.08;margin:10px 0 26px;animation:panelIn .55s cubic-bezier(.2,.8,.2,1) both}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;padding:18px 20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:17px;font-weight:600;display:flex;gap:14px;align-items:center;
  animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 60ms + .1s);transition:border-color .25s,background .25s,transform .2s}
.opt:hover:not([disabled]){border-color:var(--muted);transform:translateY(-2px)}
.opt kbd{font-family:var(--body);font-weight:700;font-style:normal;font-size:18px;color:var(--muted);width:20px}
.opt[disabled]{cursor:default}
.opt.ok{background:color-mix(in srgb,var(--good) 18%, var(--surface));border-color:var(--good);animation:okPop .5s cubic-bezier(.3,1.6,.5,1) both}
.opt.ko{background:color-mix(in srgb,var(--bad) 16%, var(--surface));border-color:var(--bad);animation:shake .45s both}
.opt.dim{opacity:.45}
@keyframes okPop{40%{transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.expl{margin-top:20px;padding:18px 20px;border-radius:16px;background:var(--surface-2);border-left:3px solid var(--c,var(--good));animation:panelIn .5s cubic-bezier(.2,.8,.2,1) both;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.expl p{margin:0;max-width:56ch}
.expl p b{color:var(--c)}
.qstart{display:grid;gap:18px;justify-items:start;padding:20px 0}
.score{font-family:var(--body);font-weight:700;font-size:clamp(120px,26vw,240px);line-height:.85;color:var(--ember);text-shadow:0 0 60px color-mix(in oklab, var(--ember) 35%, transparent);font-variant-numeric:tabular-nums}
.score small{font-size:.32em;color:var(--muted);font-style:normal}

/* ---------- Feuille (modale) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;visibility:hidden}
.sheet-wrap.open{visibility:visible}
.scrim{position:absolute;inset:0;background:color-mix(in oklab, var(--bg) 75%, black 10%);backdrop-filter:blur(6px);opacity:0;transition:opacity .35s}
.sheet-wrap.open .scrim{opacity:1}
.sheet{position:relative;width:min(760px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;
  transform:translateY(40px) scale(.97);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.2,1),opacity .35s}
.sheet-wrap.open .sheet{transform:none;opacity:1}
.sheet .slot{aspect-ratio:16/9;border-radius:0;border:0;border-bottom:1px solid var(--line)}
.sheet .ph .ini{font-size:180px}
.sheet-body{padding:24px 28px 28px;display:grid;gap:14px}
.sheet h2{font-size:clamp(34px,6vw,54px);line-height:1}
.sheet .sub{font-family:var(--display);font-style:normal;font-size:20px;color:var(--c)}
.rows{display:grid;gap:10px;margin:4px 0}
.rows div{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.rows dt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:3px}
.rows dd{margin:0}
@media (max-width:520px){.rows div{grid-template-columns:1fr;gap:2px}}
.close{position:absolute;top:12px;right:12px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:color-mix(in oklab, var(--bg) 80%, transparent);backdrop-filter:blur(8px);font-size:20px;line-height:1}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.form{display:grid;gap:14px;padding:28px}
.form label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.form input,.form textarea{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical}
.form input:focus,.form textarea:focus{border-color:var(--c,var(--ochre));outline:none}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;z-index:60;padding:11px 18px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:600;font-size:14px;transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

.view{animation:viewIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0ms !important;transition-duration:.01ms !important}
}
</style>
</head>

<main id="view"></main>

<script>
/* ================= CONTENU ================= */
const PERIODS = [
  {id:"prehistoire", title:"Préhistoire", range:"Origines → −3300", cut:"Écriture",
   intro:"Tout ce qui se passe avant l’invention de l’écriture. La Dordogne en est un des grands centres mondiaux.",
   points:[

const DEFAULT = {known:{}, images:{}, custom:[], best:0, flags:{}, flagBest:0, watch:{}, customWatch:[], favFacts:{}, mapBest:0, updated:0};
let state = structuredClone(DEFAULT);
try{ const s = JSON.parse(localStorage.getItem("cahier-culture") || "null"); if(s) state = Object.assign(structuredClone(DEFAULT), s); }catch(e){}

let dbRef = null, assetsApi = null, lastRemote = "", writing = false, again = false, saveTimer = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function setSync(s, label){ const el = $("#sync"); el.dataset.s = s; el.querySelector("span").textContent = label; }
function saveLocal(){ try{ localStorage.setItem("cahier-culture", JSON.stringify(state)); }catch(e){} }
function save(){
  state.updated = Date.now();
  saveLocal();
  if(!dbRef) return;
  clearTimeout(saveTimer);
  setSync("busy","Sauvegarde…");
  saveTimer = setTimeout(push, 600);
}
async function push(){
  if(writing){ again = true; return; }
  writing = true;
  const body = JSON.parse(JSON.stringify(state));
  lastRemote = JSON.stringify(body);
  try{ await dbRef.set(body); setSync("ok","Synchronisé"); }
  catch(e){ setSync("local","Sur cet appareil"); }
  writing = false;
  if(again){ again = false; push(); }
}

(async function connect(){
  if(!window.claude || !window.claude.use){ return; }
  try{
    const [db, user, assets] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("assets")]);
    assetsApi = assets;
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    dbRef = db.doc("data/users/" + uid + "/cahier");
    setSync("busy","Connexion…");
    const t = setTimeout(() => setSync("local","Hors ligne"), 10000);
    let first = true;
    dbRef.onSnapshot(snap => {
      if(!snap.metadata.fromCache) clearTimeout(t);
      if(snap.metadata.hasPendingWrites) return;
      const d = snap.exists ? snap.data() : null;
      if(first){
        first = false;
        if(!d || (d.updated || 0) < (state.updated || 0)){ if(state.updated) push(); else setSync("ok","Synchronisé"); return; }
      }
      if(!d) return;
      const str = JSON.stringify(d);
      if(str === lastRemote){ setSync("ok","Synchronisé"); return; }
      lastRemote = str;
      state = Object.assign(structuredClone(DEFAULT), JSON.parse(str));
      saveLocal();
      setSync("ok","Synchronisé");
      render(true);
    }, () => { clearTimeout(t); setSync("local","Sur cet appareil"); dbRef = null; });
  }catch(e){ setSync("local","Sur cet appareil"); }
})();

function shrink(file, max, q){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(), "image/jpeg", q);
    };
    img.onerror = rej; img.src = url;
  });
}
const toDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });

    if(fq.done) return; fq.done = true;
    const ok = t.dataset.v === fq.c;
    document.querySelectorAll(".opt").forEach(b => { b.disabled = true; b.style.animationDelay = "0s"; if(b.dataset.v === fq.c) b.classList.add("ok"); else if(b === t) b.classList.add("ko"); else b.classList.add("dim"); });
    const tip = tipOf(fq.c) ? " Astuce : " + tipOf(fq.c) : "";
    if(ok){ fq.streak++; state.flags[fq.c] = true; if(fq.streak > state.flagBest) state.flagBest = fq.streak; save(); const sb = $("#fstreak"); sb.textContent = fq.streak; sb.classList.add("bump");
      $("#fexpl").innerHTML = `<div class="expl" style="--c:var(--good)"><p><b>Bien vu.</b>${esc(tip)}</p><button class="btn solid" style="--c:var(--teal)" data-act="fnext">Suivant</button></div>`; }
    else { fq.streak = 0; $("#fstreak").textContent = 0; $("#fexpl").innerHTML = `<div class="expl" style="--c:var(--bad)"><p><b>C’était ${esc(FLAG_BY[fq.c][1])}.</b>${esc(tip)}</p><button class="btn solid" style="--c:var(--teal)" data-act="fnext">Drapeau suivant</button></div>`; }
  }
  else if(act === "fnext"){ nextFlag(); render(true); }
  if(act === "fans") setTimeout(() => { const ex = $("#fexpl .expl"); if(ex) ex.scrollIntoView({block:"nearest", behavior:"smooth"}); }, 60);
  else if(act === "qstart"){
    quiz = {i:0, score:0, prevBest:state.best, qs: shuffle(QUIZ).slice(0, 10).map(([q, a, w, ex, k]) => ({q, a, ex, k, opts: shuffle([a, ...w])}))};
    render(); scrollTo({top:0});
  }
  else if(act === "qans"){
    const q = quiz.qs[quiz.i], pick = q.opts[+t.dataset.i], ok = pick === q.a;
    document.querySelectorAll(".opt").forEach(b => { b.disabled = true; const o = q.opts[+b.dataset.i]; b.style.animationDelay = "0s"; if(o === q.a) b.classList.add("ok"); else if(b === t) b.classList.add("ko"); else b.classList.add("dim"); });
    if(ok) quiz.score++;
    const last = quiz.i === quiz.qs.length - 1;
    $("#expl").innerHTML = `<div class="expl" style="--c:${ok ? "var(--good)" : "var(--bad)"}"><p><b>${ok ? "Bonne réponse." : "Raté, c’était : " + esc(q.a) + "."}</b> ${esc(q.ex)}</p><button class="btn solid" style="--c:var(--ember)" data-act="qnext">${last ? "Voir mon score" : "Question suivante"}</button></div>`;
    document.querySelector(".qbar b").style.width = ((quiz.i + 1) / quiz.qs.length * 100) + "%";
    setTimeout(() => $("#expl .btn").focus({preventScroll:false}), 50);
  }
  else if(act === "qnext"){
    quiz.i++;
    if(quiz.i >= quiz.qs.length && quiz.score > state.best){ state.best = quiz.score; save(); }
    render(); scrollTo({top:0});
  }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && $("#sheet").classList.contains("open")) closeSheet();
  if(route === "anecdotes" && !$("#sheet").classList.contains("open")){ if(e.key === "ArrowRight") aGo(1); if(e.key === "ArrowLeft") aGo(-1); }
  if((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".fcard,.flip")){ e.preventDefault(); e.target.click(); }
  if(route === "drapeaux" && fMode === "serie" && "abcd".includes(e.key) && e.key.length === 1){ const b = document.querySelectorAll(".opt:not([disabled])")["abcd".indexOf(e.key)]; if(b) b.click(); }
  if(route === "quiz" && quiz && "abcd".includes(e.key) && e.key.length === 1){ const b = document.querySelector(`.opt[data-i="${"abcd".indexOf(e.key)}"]:not([disabled])`); if(b) b.click(); }
});

go();
</script>
</body>
