<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frigo Rosé Demandes</title>
<meta name="theme-color" content="#0b0b0e">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Demandes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
/* Frigo Rosé Demandes : la plateforme où la famille demande films, séries, idées de chaînes et vidéos.
   Même ambiance que l'appli télé (sombre, affiches, rose). La préparation se fait dans Frigo Rosé Studio. */
:root{
  --bg:#0b0b0e;--s1:#141418;--s2:#1c1c22;--s3:#26262e;--line:rgba(255,255,255,.08);--ink:#f5f4f8;--mute:#a4a2ad;--faint:#6e6c78;
  --accent:#ff3d7f;--accent2:#ff7aa6;--accent-soft:rgba(255,61,127,.14);
  --prep:#f5b400;--prep-soft:rgba(245,180,0,.14);--live:#36d399;--live-soft:rgba(54,211,153,.14);
  --ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:500 16px var(--ui);color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--s1)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{resize:none;min-height:76px}
.glow{position:fixed;inset:-20vh -20vw auto;height:70vh;pointer-events:none;z-index:0;
  background:radial-gradient(50% 60% at 30% 20%,rgba(255,61,127,.22),transparent 70%),radial-gradient(40% 50% at 85% 0%,rgba(110,90,255,.18),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:calc(18px + var(--safe-t)) 18px calc(110px + var(--safe-b))}

/* ---------- Choix du profil ---------- */
.who-scr{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:40px 22px;text-align:center;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand .mark{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;box-shadow:0 6px 20px rgba(255,61,127,.45)}
.brand .mark svg{width:18px;height:18px}
.who-scr h1{margin:0;font-size:clamp(30px,8vw,44px);font-weight:900;letter-spacing:-.04em;line-height:1.05}
.who-scr p{margin:8px 0 0;color:var(--mute)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,104px));gap:22px 18px;justify-content:center}
.ptile{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:9px;color:var(--mute);font-weight:600;font-size:15px;animation:pop .45s cubic-bezier(.2,.9,.3,1.2) backwards}
.ptile:nth-child(2){animation-delay:.05s}.ptile:nth-child(3){animation-delay:.1s}.ptile:nth-child(4){animation-delay:.15s}.ptile:nth-child(5){animation-delay:.2s}.ptile:nth-child(6){animation-delay:.25s}.ptile:nth-child(n+7){animation-delay:.3s}
.ptile .pa{width:96px;height:96px;border-radius:22px;font-size:38px;transition:transform .2s,box-shadow .2s}
.ptile:hover .pa,.ptile:focus-visible .pa{transform:scale(1.05);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.ptile:hover,.ptile:focus-visible{color:var(--ink);outline:none}
.ptile .plus{background:var(--s2);color:var(--mute);font-weight:400;font-size:44px;border:1px dashed rgba(255,255,255,.18)}
.other{display:flex;gap:8px;width:min(360px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.92)}}
.pa{border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--c,#555)}
.pa img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- En-tête ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.me{display:flex;align-items:center;gap:9px;background:var(--s1);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;font-weight:600;font-size:14px}
.me .pa{width:30px;height:30px;border-radius:50%;font-size:13px}
.hello{margin:26px 0 4px;font-size:clamp(30px,8.5vw,44px);font-weight:900;letter-spacing:-.045em;line-height:1.02}
.hello span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);margin:0}

/* ---------- Bonnes nouvelles ---------- */
.news{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.nw{position:relative;display:flex;align-items:center;gap:14px;padding:12px;border-radius:18px;background:linear-gradient(120deg,rgba(54,211,153,.18),rgba(54,211,153,.04));border:1px solid rgba(54,211,153,.3);animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
.nw .po{width:46px;height:68px;border-radius:9px}
.nw b{display:block;font-size:16px;letter-spacing:-.01em}
.nw small{color:#bfeedd;font-size:13px}
.nw .x{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--mute);font-size:18px;padding:4px}

/* ---------- Demander ---------- */
.ask{margin-top:24px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kind{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);border-radius:20px;padding:16px 16px 15px;background:var(--s1);display:flex;flex-direction:column;gap:22px;min-height:118px;transition:transform .15s,border-color .15s}
.kind:active{transform:scale(.97)}
.kind:hover{border-color:rgba(255,255,255,.2)}
.kind .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--k);color:#fff;box-shadow:0 8px 22px -6px var(--k)}
.kind .ic svg{width:21px;height:21px}
.kind b{font-size:17px;letter-spacing:-.02em;display:block}
.kind small{color:var(--mute);font-size:13px;display:block;margin-top:1px}
.kind::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--k);opacity:.12;filter:blur(8px)}

/* ---------- Rangées ---------- */
.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.03em}
.sec-h span{color:var(--faint);font-size:13px;font-weight:600}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:none;width:132px;scroll-snap-align:start;text-decoration:none;color:inherit}
.card .po{width:132px;height:196px;border-radius:14px;position:relative}
.card .po .on{position:absolute;left:8px;bottom:8px;right:8px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:4px 7px;border-radius:7px;background:rgba(0,0,0,.66);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card b{display:block;margin-top:8px;font-size:14px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--mute);font-size:12px}
/* affiche (ou visuel de secours) */
.po{overflow:hidden;background:var(--s2);display:grid;place-items:center;flex:none;position:relative}
.po img{width:100%;height:100%;object-fit:cover;display:block}
.po .fb{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;font-weight:800;font-size:13px;line-height:1.15;letter-spacing:-.01em;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2))}
.po .fb svg{position:absolute;top:9px;left:9px;width:18px;height:18px;opacity:.8}

/* ---------- Liste ---------- */
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
.search input{padding-left:42px;background:var(--s1)}
.chips{display:flex;gap:7px;overflow-x:auto;margin:0 -18px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;color:var(--mute);background:var(--s1);border:1px solid var(--line);border-radius:99px;padding:5px 12px;white-space:nowrap}
.chip.p{padding-left:4px}
.chip .pa{width:24px;height:24px;font-size:11px}
.chip.on{background:var(--ink);color:#111;border-color:var(--ink)}
.chip .c{opacity:.6;font-variant-numeric:tabular-nums}
.person{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);margin-bottom:12px;animation:pop .35s ease-out}
.person .pa{width:58px;height:58px;border-radius:16px;font-size:24px}
.person b{display:block;font-size:20px;letter-spacing:-.02em}
.person small{color:var(--mute);font-size:14px}
.list{display:flex;flex-direction:column;gap:10px}
.rq{display:flex;gap:13px;padding:11px;border-radius:18px;background:var(--s1);border:1px solid var(--line)}
.rq.fresh{animation:pop .45s ease-out;border-color:var(--accent)}
.rq .po{width:62px;height:92px;border-radius:11px}
.rq .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rq .t{font-weight:700;font-size:16px;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.rq .m{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rq .m .pa{width:18px;height:18px;font-size:9px}
.rq .note{font-size:14px;color:#d8d6de;white-space:pre-line;overflow-wrap:anywhere}
.rq .ft{margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.st.attente{background:var(--s3);color:var(--mute)}
.st.cours{background:var(--prep-soft);color:var(--prep)}
.st.ajoute{background:var(--live-soft);color:var(--live)}
.st.non{background:var(--s3);color:var(--faint);text-decoration:line-through}
.fan{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--s2);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--mute);transition:transform .15s}
.fan svg{width:15px;height:15px}
.fan.on{background:var(--accent-soft);border-color:rgba(255,61,127,.5);color:var(--accent2)}
.fan.on svg{fill:currentColor}
.fan:active{transform:scale(.92)}
.fan.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}
.fans{display:flex}
.fans .pa{width:20px;height:20px;font-size:9px;border:2px solid var(--s1);margin-left:-6px}
.fans .pa:first-child{margin-left:0}
.vid{display:flex;gap:10px;align-items:center;margin-top:4px;padding:6px;border-radius:12px;background:var(--s2);text-decoration:none;color:inherit}
.vid img{width:88px;height:50px;border-radius:8px;object-fit:cover;flex:none;background:#000}
.vid .vt{min-width:0;font-size:13px;line-height:1.3}
.vid .vt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vid .vt span{color:var(--accent2);font-weight:600}
.empty{padding:34px 16px;text-align:center;color:var(--mute);background:var(--s1);border:1px dashed var(--line);border-radius:18px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
.seg{display:flex;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font-weight:600;font-size:14px;padding:8px 6px;border-radius:10px}
.seg button.on{background:var(--s3);color:var(--ink)}

/* ---------- Feuille « demander » ---------- */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--s1);border-radius:26px 26px 0 0;border-top:1px solid rgba(255,255,255,.1);padding:10px 18px calc(22px + var(--safe-b));animation:up .35s cubic-bezier(.2,.9,.3,1)}
@media (min-width:720px){.sheet{left:50%;right:auto;width:640px;transform:translateX(-50%);bottom:auto;top:6vh;border-radius:26px;animation:fade .25s}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--s3);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:24px;font-weight:900;letter-spacing:-.035em}
.sheet .hint{color:var(--mute);font-size:14px;margin:0 0 14px}
.sheet form{display:flex;flex-direction:column;gap:11px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
@media (min-width:520px){.res{grid-template-columns:repeat(4,1fr)}}
.ri{background:none;border:0;padding:0;text-align:left;color:inherit}
.ri .po{width:100%;aspect-ratio:2/3;border-radius:12px;transition:transform .15s,box-shadow .15s}
.ri:active .po{transform:scale(.96)}
.ri.on .po{box-shadow:0 0 0 3px var(--accent)}
.ri b{display:block;margin-top:6px;font-size:13px;line-height:1.2;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ri small{color:var(--mute);font-size:12px}
.pick{display:flex;gap:14px;align-items:center;padding:10px;border-radius:16px;background:var(--s2)}
.pick .po{width:70px;height:104px;border-radius:11px}
.pick b{display:block;font-size:18px;letter-spacing:-.02em;line-height:1.2}
.pick small{color:var(--mute);font-size:13px;display:block;margin-top:3px}
.pick .chg{margin-top:8px;background:none;border:0;padding:0;color:var(--accent2);font-weight:600;font-size:14px}
.dup{padding:12px 14px;border-radius:14px;background:var(--accent-soft);border:1px solid rgba(255,61,127,.35);font-size:14px}
.dup b{color:var(--accent2)}
.loading{color:var(--mute);font-size:14px;padding:6px 2px}
.manual{background:none;border:1px dashed rgba(255,255,255,.18);border-radius:14px;color:var(--mute);padding:12px;font-size:14px;font-weight:600;text-align:left}
.btn{border:0;border-radius:15px;padding:15px 18px;font-weight:700;font-size:16px;background:var(--accent);color:#fff;box-shadow:0 10px 30px -10px rgba(255,61,127,.7);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.ghost{background:var(--s2);color:var(--ink);box-shadow:none}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:4px 2px -4px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
/* confirmation */
.done{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .2s}
.done .in{text-align:center;padding:28px;animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
.done .ok{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 14px 40px -8px rgba(255,61,127,.8)}
.done .ok svg{width:42px;height:42px}
.done b{display:block;font-size:24px;font-weight:900;letter-spacing:-.03em}
.done small{color:var(--mute);font-size:15px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:31;overflow:hidden}
.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.sync{position:fixed;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--faint);background:rgba(20,20,24,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--live)}
.sync.ok{opacity:0;transition:opacity 1s 2s}
mark{background:rgba(255,61,127,.28);color:inherit;border-radius:3px;padding:0 1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow"></div>

<!-- Qui es-tu ? -->
<section class="who-scr" id="scr-who" hidden>
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 3l4 4 4-4"/></svg></span>Frigo Rosé TV</div>
  <div><h1>Qui es-tu ?</h1><p>Choisis ton profil, comme sur la télé.</p></div>
  <div class="pgrid" id="pgrid"></div>
  <form class="other" id="other" hidden><input id="other-in" maxlength="30" placeholder="Ton prénom" autocomplete="off" aria-label="Ton prénom"><button class="btn" type="submit">OK</button></form>
</section>

<!-- Accueil -->
<main class="wrap" id="scr-main" hidden>
  <div class="top">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 3l4 4 4-4"/></svg></span>Demandes</div>
    <button class="me" id="me" aria-label="Changer de profil"></button>
  </div>
  <h1 class="hello" id="hello"></h1>
  <p class="sub">Qu'est-ce qui te ferait plaisir sur la télé ?</p>
  <div class="news" id="news"></div>

  <div class="ask">
    <button class="kind" data-k="film" style="--k:#ff3d7f"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg></span><span><b>Un film</b><small>Cherche et choisis l'affiche</small></span></button>
    <button class="kind" data-k="serie" style="--k:#7c6cff"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 3l4 4 4-4"/></svg></span><span><b>Une série</b><small>Tous les épisodes en chaîne</small></span></button>
    <button class="kind" data-k="chaine" style="--k:#16b98a"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M7.5 12a4.5 4.5 0 0 1 9 0"/><circle cx="12" cy="13" r="1.6"/><path d="M12 15v6"/></svg></span><span><b>Une chaîne</b><small>Ton idée de nouvelle chaîne</small></span></button>
    <button class="kind" data-k="video" style="--k:#ff8a1f"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span><span><b>Une vidéo</b><small>Un lien qui t'a plu</small></span></button>
  </div>

  <section class="sec" id="sec-new" hidden>
    <div class="sec-h"><h2>Arrivé sur la télé</h2><span id="new-n"></span></div>
    <div class="rail" id="rail"></div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Les demandes</h2><span id="count"></span></div>

const OKDESC={film:/film|long[- ]m[ée]trage|dessin anim|animation|com[ée]die|documentaire|t[ée]l[ée]film/i,serie:/s[ée]rie|feuilleton|sitcom|[ée]mission|dessin anim|anime|programme/i};
/* Cherche les affiches d'un titre (film ou série) */
async function wikiFind(v,k){
  const u="https://fr.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=14&gsrsearch="+encodeURIComponent(v+" "+(k==="serie"?"série":"film"))+"&prop=pageimages|description|langlinks&piprop=thumbnail&pithumbsize=400&pilicense=any&lllang=en&lllimit=50";
  const j=await fetch(u).then(r=>r.json());
  let items=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index).map(p=>({title:p.title,desc:p.description||"",img:p.thumbnail&&p.thumbnail.source||"",en:p.langlinks&&p.langlinks[0]&&p.langlinks[0]["*"]||""}));
  items=items.filter(x=>OKDESC[k].test(x.desc)&&!/^Liste|^Saison|^Personnages|homonymie/i.test(x.title)).slice(0,8);
  const need=items.filter(x=>!x.img&&x.en);
  if(need.length){try{const j2=await fetch("https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&titles="+encodeURIComponent(need.map(x=>x.en).join("|"))+"&prop=pageimages&piprop=thumbnail&pithumbsize=400&pilicense=any").then(r=>r.json());
    const by={};Object.values((j2.query&&j2.query.pages)||{}).forEach(p=>{if(p.thumbnail)by[p.title]=p.thumbnail.source});
    ((j2.query&&j2.query.normalized)||[]).forEach(n=>{if(by[n.to])by[n.from]=by[n.to]});need.forEach(x=>{x.img=by[x.en]||""})}catch(e){}}
  items.forEach(x=>{const y=/((?:19|20)\d\d)\)\s*$/.exec(x.title)||/sortie?s? (?:en |le .{0,20}?)((?:19|20)\d\d)/i.exec(x.desc)||/\b((?:19|20)\d\d)\b/.exec(x.desc);x.year=y?y[1]:"";x.clean=x.title.replace(/\s*\((film|série|série télévisée|téléfilm|film d'animation)?[^)]*\)\s*$/i,"").trim()||x.title;x.img=x.img.replace(/\?utm_[^#]*$/,"")});
  return items;
}
async function search(v){
  const my=++sN;$("sload").hidden=false;
  try{const items=await wikiFind(v,kind);if(my!==sN)return;renderRes(items)}
  catch(e){if(my===sN){$("res").textContent="";$("res").append(el("div","loading","Pas de connexion aux affiches, tu peux quand même envoyer le titre."))}}
  if(my===sN)$("sload").hidden=true;
}
/* Les anciennes demandes reçoivent leur affiche toute seule (une fois pour toutes, pour tout le monde) */
const BF=new Set();let bfOn=false;
async function backfill(){
  if(bfOn||!db)return;bfOn=true;
  try{
    for(const r of reqs){
      if(!["film","serie",undefined,""].includes(r.type)||r.poster||r.posterTried||BF.has(r.id)||!r.title)continue;
      BF.add(r.id);const k=r.type==="serie"?"serie":"film";
      try{
        const t=r.title.replace(/\b(1|2|3)\s+et\s+(2|3)\b/i,"").replace(/\(.*?\)/g,"").trim()||r.title;
        const items=await wikiFind(t,k);const want=nk(t);
        const best=items.find(x=>x.img&&(nk(x.clean)===want||nk(x.clean).startsWith(want)||want.startsWith(nk(x.clean))))||null;
        const up=best?{poster:best.img}:{posterTried:true};if(best&&best.year&&!r.year)up.year=best.year;
        await ref("requests/"+r.id).update(up);
      }catch(e){}
      await new Promise(x=>setTimeout(x,350));
    }
  }finally{bfOn=false}
}
function renderRes(items){
  const box=$("res");box.textContent="";
  if(!items.length){box.append(el("div","loading","Aucune affiche trouvée. Essaie autrement, ou envoie le titre tel quel."));return}
  items.forEach(x=>{const b=el("button","ri");b.type="button";b.append(poster({title:x.clean,poster:x.img,type:kind}),el("b",null,x.clean),el("small",null,x.year||" "));b.title=x.desc;b.onclick=()=>choose({title:x.clean,poster:x.img,year:x.year,desc:x.desc,wiki:x.title});box.append(b)});
}
$("manual").onclick=()=>{const v=$("sq").value.trim();if(v)choose({title:v,poster:"",year:"",desc:""})};
function choose(x){
  picked=x;const dup=reqs.find(r=>r.type===kind&&nk(r.title)===nk(x.title)&&st(r)!=="non");picked.dupOf=dup?dup.id:null;
  $("res").textContent="";$("manual").hidden=true;$("b-search").hidden=true;
  const p=$("pick");p.textContent="";p.append(poster({title:x.title,poster:x.poster,type:kind}));const t=el("div");t.append(el("b",null,x.title),el("small",null,[x.year,x.desc&&x.desc.length<90?x.desc:""].filter(Boolean).join(" · ")||TYPES[kind]));
  const c=el("button","chg","Changer");c.type="button";c.onclick=()=>{picked=null;p.hidden=true;$("dup").hidden=true;$("b-search").hidden=false;$("sq").focus();$("sq").dispatchEvent(new Event("input"));check()};t.append(c);p.append(t);p.hidden=false;
  const d=$("dup");if(dup){d.textContent="";d.append(document.createTextNode("Déjà demandé par "),el("b",null,dup.who||"quelqu'un"),document.createTextNode(" ("+LABEL[st(dup)].toLowerCase()+"). Appuie sur « Moi aussi ! » pour dire que tu le veux aussi."));d.hidden=false}else d.hidden=true;
  check();
}
$("vlink").oninput=()=>{clearTimeout(vT);vT=setTimeout(loadVid,350);check()};
async function loadVid(){
  const u=cleanUrl($("vlink").value),box=$("vprev");box.textContent="";vinfo=null;if(!u)return;
  const id=ytId(u);vinfo={url:u,thumb:id?"https://i.ytimg.com/vi/"+id+"/mqdefault.jpg":"",title:""};renderVid();
  if(id){try{const r=await fetch("https://www.youtube.com/oembed?format=json&url="+encodeURIComponent(u));if(r.ok){const j=await r.json();if(vinfo&&vinfo.url===u){vinfo.title=j.title||"";vinfo.author=j.author_name||"";renderVid()}}}catch(e){}}
}
function renderVid(){const box=$("vprev");box.textContent="";if(!vinfo)return;const a=el("a","vid");a.href=vinfo.url;a.target="_blank";a.rel="noopener";if(vinfo.thumb){const i=el("img");i.src=vinfo.thumb;i.alt="";a.append(i)}const t=el("div","vt");t.append(el("b",null,vinfo.title||siteOf(vinfo.url)),el("span",null,(vinfo.author?vinfo.author+" · ":"")+"Voir ↗"));a.append(t);box.append(a)}

$("f").onsubmit=async e=>{
  e.preventDefault();if($("send").disabled)return;$("send").disabled=true;
  const note=$("note").value.trim(),me=nk(who);
  try{
    if(picked&&picked.dupOf){await ref("requests/"+picked.dupOf+"/fans/"+me).set(true);freshId=picked.dupOf;closeSheet();celebrate("Noté, toi aussi !","On le saura dans la régie.");return}
    const body={who,title:"",type:kind,status:"attente",createdAt:Date.now(),channel:"",source:""};
    if(picked){body.title=picked.title;if(picked.poster)body.poster=picked.poster;if(picked.year)body.year=picked.year;if(picked.desc)body.desc=picked.desc.slice(0,160)}
    else if(kind==="chaine")body.title=$("cname").value.trim();
    else if(kind==="video"){const l=cleanUrl($("vlink").value);body.link=l;body.title=(vinfo&&vinfo.url===l&&vinfo.title)||"Vidéo "+siteOf(l);if(vinfo&&vinfo.thumb)body.thumb=vinfo.thumb;if($("wch").value)body.want=$("wch").value}
    if(note)body.note=note;
    const p=ref("requests").push();freshId=p.key;await p.set(body);
    closeSheet();celebrate("C'est envoyé !",kind==="chaine"?"Ton idée est dans la liste.":"Tu seras prévenu quand ça arrive sur la télé.");
  }catch(err){alert("Pas envoyé. Vérifie ta connexion et réessaie.")}
  check();
};
function celebrate(t,s){
  const d=el("div","done");d.innerHTML='<div class="in"><div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div></div>';
  d.firstChild.append(el("b",null,t),el("small",null,s));document.body.append(d);
  const c=el("div","conf");const cols=["#ff3d7f","#7c6cff","#16b98a","#ff8a1f","#ffd23f","#fff"];
  for(let i=0;i<46;i++){const x=el("i");x.style.left=Math.random()*100+"vw";x.style.background=cols[i%cols.length];x.style.animationDelay=Math.random()*.4+"s";x.style.animationDuration=1.2+Math.random()*.9+"s";c.append(x)}
  document.body.append(c);try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
  const end=()=>{d.remove();c.remove();const f=document.querySelector(".rq.fresh");if(f)f.scrollIntoView({block:"center",behavior:"smooth"})};
  d.onclick=end;setTimeout(end,1900);
}

/* L'adresse de cette appli est envoyée à la télé : le QR code s'y affiche tout seul */
function registerUrl(){try{if(!/^https?:$/.test(location.protocol))return;const h=location.hostname;if(!h||/^(localhost|127\.|10\.|192\.168\.)/.test(h))return;
  const u=location.origin+location.pathname.replace(/index\.html?$/,"");ref("config/demandesUrl2").once("value").then(s=>{if(s.val()!==u)return ref("config/demandesUrl2").set(u)}).catch(()=>{})}catch(e){}}

/* ---------- Démarrage ---------- */
function start(){if(who){$("scr-who").hidden=true;$("scr-main").hidden=false;renderAll()}else showWho()}
try{
  firebase.initializeApp(FBC);db=firebase.database();
  db.ref(".info/connected").on("value",s=>{const ok=s.val()===true;$("sync").classList.toggle("ok",ok);$("sync").lastChild.textContent=ok?"synchronisé":"hors ligne";check()});
  ref("requests").on("value",s=>{const v=s.val()||{};reqs=Object.keys(v).map(k=>({id:k,...v[k]})).filter(r=>r&&r.title).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));loaded=true;renderAll();setTimeout(backfill,1500)});
  ref("channels").on("value",s=>{const v=s.val()||{};chans=Object.keys(v).map(k=>({id:k,...v[k]})).filter(c=>c&&c.name);renderAll()});
  let pubP={},syncP={};
  const mergeP=()=>{const m={};const hasSync=Object.values(syncP).some(p=>p&&p.name);/* les profils en ligne font foi ; l'ancienne liste ne sert que s'il n'y en a pas */Object.values(hasSync?{}:pubP).forEach(p=>{if(p&&p.name)m[nk(p.name)]={...p}});Object.values(syncP).forEach(p=>{if(p&&p.name)m[nk(p.name)]={...(m[nk(p.name)]||{}),name:p.name,av:p.av,pic:p.pic,img:p.img}});profs=m;if(!$("scr-who").hidden)renderWho();else renderAll()};
  ref("profiles").on("value",s=>{pubP=s.val()||{};mergeP()},()=>{});
  ref("profsync").on("value",s=>{syncP=s.val()||{};mergeP()},()=>{});
  registerUrl();
}catch(e){}
start();
</script>
