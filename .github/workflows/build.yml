name: Appli télé
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  studio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fabrication de Frigo Rosé Studio
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller psutil
          pyinstaller --onefile --noconsole --name FrigoRoseStudio --icon studio/icon.ico --add-data "studio/page.html;." --add-data "studio/icon.png;." studio/frigo_studio.py
          Get-Item dist/FrigoRoseStudio.exe
      - name: Test sur Windows
        shell: pwsh
        continue-on-error: true
        run: ./studio/smoke.ps1
      - name: Rapport du test
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if (-not (Test-Path smoke.md)) { "Pas de rapport" | Out-File smoke.md }
          gh issue create --repo ${{ github.repository }} --title "Test Studio ${{ github.run_number }}" --body-file smoke.md
      - uses: actions/upload-artifact@v4
        with:
          name: studio
          path: dist/FrigoRoseStudio.exe
  build:
    needs: studio
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fabrication de l'APK
        run: |
          set -eo pipefail
          exec > >(tee build.log) 2>&1
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          mkdir -p android/app/src/main/assets && cp web/index.html android/app/src/main/assets/index.html
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" -p android assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk frigo-rose-tv.apk
          cp frigo-rose-tv.apk web/tv.apk
          ls -la frigo-rose-tv.apk
      - uses: actions/download-artifact@v4
        with:
          name: studio
          path: web
      - name: Publication de l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-${{ github.run_number }}
          name: Frigo Rosé TV ${{ github.run_number }}
          files: |
            frigo-rose-tv.apk
            web/FrigoRoseStudio.exe
          make_latest: true
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Rapport d'erreur
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          { echo '```'; tail -n 150 build.log; echo '```'; } > report.md
          gh issue create --repo ${{ github.repository }} --title "Erreur fabrication ${{ github.run_number }}" --body-file report.md
